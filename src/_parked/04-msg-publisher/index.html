<div class="card">
    <div class="form-group flex-row">
        <div class="w-full">
            <label>Destination</label>
            <input type="text" class="form-control" placeholder="Topic or Queue Name">
        </div>
        <div class="w-full" style="max-width: 150px;">
            <label>Type</label>
            <select class="form-control">
                <option>Topic</option>
                <option>Queue</option>
            </select>
        </div>
    </div>

    <div class="form-group flex-row">
        <div class="w-full">
            <label>Delivery Mode</label>
            <select class="form-control">
                <option>Direct</option>
                <option>Persistent</option>
            </select>
        </div>
        <div class="w-full">
            <label>DMQ Eligible</label>
            <div class="items-center" style="display: flex; height: 42px;">
                <input type="checkbox" checked style="width: 20px; height: 20px;">
            </div>
        </div>
        <div class="w-full">
            <label>Priority (0-9)</label>
            <input type="number" class="form-control" min="0" max="9" value="0">
        </div>
    </div>

    <div class="form-group flex-row">
        <div class="w-full">
            <label>TTL (ms)</label>
            <input type="number" class="form-control" placeholder="0 (forever)">
        </div>
        <div class="w-full">
            <label>Reply-To</label>
            <input type="text" class="form-control">
        </div>
        <div class="w-full">
            <label>Correlation ID</label>
            <input type="text" class="form-control">
        </div>
    </div>

    <div class="form-group">
        <label>Message Content</label>
        <textarea class="form-control" rows="8" placeholder="Enter message content..."></textarea>
    </div>

    <button id="btn-publish" class="btn btn-primary">Publish Message</button>
</div>
