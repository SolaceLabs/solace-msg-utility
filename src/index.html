    <!-- Desktop-only gate. Toggles `html.mobile-blocked` based on viewport width.
         Threshold matches the layout's minimum usable width — below it, the overlay
         covers the app. Re-checks on resize so a desktop user shrinking their window
         (or a mobile user rotating) sees the gate appear/disappear without reload. -->
    <script>
        (function () {
            var MIN_DESKTOP_WIDTH = 1024;
            function check() {
                var blocked = window.innerWidth < MIN_DESKTOP_WIDTH;
                document.documentElement.classList.toggle('mobile-blocked', blocked);
                if (blocked) {
                    var vp = document.getElementById('desktop-only-viewport');
                    if (vp) vp.textContent = window.innerWidth + ' × ' + window.innerHeight + ' px';
                }
            }
            check();
            window.addEventListener('resize', check);
        })();
    </script>

    <!-- Solace Library Loader -->
    <script>
        (function () {
            window.solaceLibLoaded = false;
            // 'loading' until the loader reaches its one final outcome: 'loaded',
            // 'outdated' or 'missing'. Each outcome also fires 'Solclient:settled'
            // so a Connect pressed meanwhile can wait (core/services/solace-client.ts).
            window.solaceLibState = 'loading';
            window.jszipLoaded = false;

            // What the banner should show once the library loader reaches an outcome:
            // undefined = none yet, null = hide it, a string = show it with that HTML.
            // The loader can finish before the browser has parsed the banner, so the
            // outcome is recorded and applied whenever the banner exists: here, and
            // again by the small script placed right after the banner element.
            var bannerOutcome;
            function applyBanner() {
                const banner = document.getElementById('missing-lib-banner');
                if (!banner || bannerOutcome === undefined) return;
                if (bannerOutcome === null) {
                    banner.style.display = 'none';
                    return;
                }
                banner.classList.remove('is-pending');
                banner.innerHTML = bannerOutcome;
                banner.style.display = 'block';
            }
            window.solaceLibApplyBanner = applyBanner;
            function showBanner(html) {
                bannerOutcome = html;
                applyBanner();
            }
            // If nothing settles within 30 s the banner must not keep saying
            // "Loading": a late outcome still replaces this message.
            const watchdog = setTimeout(() => showBanner(
                'The Solace library did not finish loading. Check that solclient.js is next to this page.'
            ), 30000);
            // `html` is the banner's final content: null hides it, a string shows it as an error.
            function settleSolclient(state, html) {
                clearTimeout(watchdog);
                showBanner(html);
                window.solaceLibState = state;
                window.dispatchEvent(new CustomEvent('Solclient:settled', { detail: { state } }));
            }
            // Global Version Comparator
            window.compareVersions = function (v1, v2) {
                const p1 = (v1 || '0').split('.').map(Number);
                const p2 = (v2 || '0').split('.').map(Number);
                for (let i = 0; i < Math.max(p1.length, p2.length); i++) {
                    const n1 = p1[i] || 0;
                    const n2 = p2[i] || 0;
                    if (n1 > n2) return 1;
                    if (n1 < n2) return -1;
                }
                return 0;
            };

            // Solclient Loader
            function loadSolclient(src, fallback) {
                const script = document.createElement('script');
                script.src = src;
                // A candidate that fails to load, or loads without defining
                // window.solace, falls back to the next one; the last one settles 'missing'.
                const failed = (why) => {
                    console.warn(why);
                    if (fallback) {
                        loadSolclient(fallback, null); // Try fallback
                    } else {
                        console.error('Solace Client API missing.');
                        settleSolclient('missing', '&#9888;&#65039; <strong>solclient.js</strong> not found. Please place it in the same directory.');
                    }
                };
                script.onload = () => {
                    console.log(`Loaded ${src}`);
                    if (!window.solace) {
                        failed(`${src} loaded but defines no window.solace`);
                        return;
                    }
                    // Version Check (>= 10.18.3). solaceLibLoaded gates connecting
                    // (see core/services/solace-client.ts), so "cannot verify" must
                    // not mean "refuse": some custom/minified SDK builds strip
                    // Version.version, and blocking those would break a working
                    // deployment over a missing string. Only a version we can read
                    // AND that falls below the floor blocks.
                    const MIN_VERSION = '10.18.3';
                    const reportedVersion = window.solace.Version && window.solace.Version.version;
                    console.log(`Solace API Version: ${reportedVersion || '(not reported)'}`);
                    if (!reportedVersion) {
                        console.warn(`Solclient reported no version; cannot verify the ${MIN_VERSION}+ requirement. Proceeding.`);
                        window.solaceLibLoaded = true;
                        window.dispatchEvent(new CustomEvent('Solclient:loaded'));
                        settleSolclient('loaded', null);
                    } else if (window.compareVersions(reportedVersion, MIN_VERSION) >= 0) {
                        window.solaceLibLoaded = true;
                        window.dispatchEvent(new CustomEvent('Solclient:loaded'));
                        settleSolclient('loaded', null);
                    } else {
                        const err = `Solace API Version ${reportedVersion} is too old. Required: ${MIN_VERSION}+`;
                        console.error(err);
                        settleSolclient('outdated', `&#9888;&#65039; <strong>Outdated Library</strong>: Found Solclient ${reportedVersion}, required ${MIN_VERSION}+. Connecting is disabled.`);
                    }
                };
                script.onerror = () => failed(`Failed to load ${src}`);
                document.head.appendChild(script);
            }
            // Start Solclient Load. Two candidates only — the file next to the
            // HTML, then a sibling js/ folder. loadSolclient takes (src, fallback);
            // extra arguments would be silently ignored, so a debug build must be
            // renamed to solclient.js rather than dropped in under its own name.
            loadSolclient('solclient.js', 'js/solclient.js');

            // JSZip Loader
            const zipPaths = ['jszip.min.js', 'js/jszip.min.js', 'jszip.js', 'js/jszip.js'];
            function loadZip(index) {
                if (index >= zipPaths.length) {
                    console.warn('JSZip could not be loaded from any path.');
                    return;
                }
                const s = document.createElement('script');
                s.src = zipPaths[index];
                s.onload = () => {
                    console.log(`Loaded ${zipPaths[index]}`);

                    // Version Check (>= 3.10.1)
                    if (window.JSZip) {
                        const MIN_VERSION = '3.10.1';
                        // JSZip version is usually just window.JSZip.version
                        // Note: Some minified versions might strip it, but standard builds have it.
                        const v = window.JSZip.version || '0.0.0';
                        console.log(`JSZip Version: ${v}`);

                        // Clean version string just in case (e.g. "3.10.1")
                        if (window.compareVersions(v, MIN_VERSION) >= 0) {
                            window.jszipLoaded = true;
                            window.dispatchEvent(new CustomEvent('jszip:loaded'));
                        } else {
                            console.error(`JSZip version ${v} is too old. Required: ${MIN_VERSION}+`);
                            // Not setting jszipLoaded = true
                        }
                    } else {
                        console.warn('JSZip loaded but window.JSZip object not found.');
                    }
                };
                s.onerror = () => {
                    loadZip(index + 1);
                };
                document.head.appendChild(s);
            }
            loadZip(0);

        })();
    </script>

                <div id="sidebar-account" class="sidebar-account"></div>
                <div class="sidebar-status">
                    <div class="status-item">
                        <!-- Client Icon (Activity/Signal) -->
                        <svg id="status-indicator-client" class="status-icon" width="16" height="16" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                        </svg>
                        <span class="status-label">Client</span>
                    </div>
                    <div class="status-item">
                        <!-- SEMP Icon (Server/Database) -->
                        <svg id="status-indicator-semp" class="status-icon" width="16" height="16" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                        </svg>
                        <span class="status-label">SEMP</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <h1 id="page-title">Welcome</h1>
                <div class="top-bar-actions">
                    <!-- The notification bell and its drawer (src/core/components/notification-center/), mounted by the kernel. -->
                    <div id="notification-bell-slot" class="notification-bell-slot"></div>
                </div>
            </header>

            <div id="module-container" class="module-view-container">
                <!-- Dynamic Module Content Loaded Here. The kernel removes #app-loading when the
                     first module view is shown, or replaces its text when none is installed. -->
                <div id="app-loading" class="app-loading" role="status">Loading...</div>
            </div>
        </main>
    </div>

    <!-- Toast / Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Module HTML Templates — injected at build time by the `inject-module-templates`
         Vite plugin from each `src/modules/<id>/index.html`. -->
    <!-- @module-templates -->

    <!-- Vite Entry Point -->
    <script type="module" src="/main.ts"></script>
</body>

</html>
