<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="640" height="330" fill="#f8fafc" rx="8"/>
    <rect x="20" y="20" width="570" height="130" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="44" y="62" font-size="14">Delete connection &quot;west-test&quot;?</text>
    <rect x="400" y="100" width="66" height="26" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="433" y="117" font-weight="700" text-anchor="middle">Cancel</text>
    <rect x="474" y="100" width="100" height="26" fill="#00C895" rx="5"/>
    <text x="524" y="117" fill="#ffffff" font-weight="700" text-anchor="middle">Delete</text>
    <circle cx="612" cy="60" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="612" y="64" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <circle cx="612" cy="113" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="612" y="117" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="20" y="180" width="570" height="130" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="44" y="222" font-size="13">This connection was changed by someone else since you opened it.</text>
    <rect x="400" y="260" width="66" height="26" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="433" y="277" font-weight="700" text-anchor="middle">Cancel</text>
    <rect x="474" y="260" width="100" height="26" fill="#00C895" rx="5"/>
    <text x="524" y="277" fill="#ffffff" font-weight="700" text-anchor="middle">Reload</text>
    <circle cx="612" cy="220" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="612" y="224" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <circle cx="612" cy="273" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="612" y="277" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
</svg>
