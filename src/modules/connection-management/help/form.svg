    <rect x="60" y="250" width="130" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="70" y="268">https (TLS)</text>
    <path d="M170 262 l4 4 l4 -4" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="200" y="242" font-size="11" fill="#64748b" font-weight="700">Port</text>
    <rect x="200" y="250" width="90" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="210" y="268">943</text>
    <text x="300" y="242" font-size="11" fill="#64748b" font-weight="700">Username</text>
    <rect x="300" y="250" width="150" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="310" y="268">semp-reader</text>
    <text x="460" y="242" font-size="11" fill="#64748b" font-weight="700">Password</text>
    <text x="518.8" y="242" font-size="10" fill="#64748b">(leave blank to keep current)</text>
    <rect x="460" y="250" width="230" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <circle cx="22" cy="264" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="22" y="268" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <circle cx="730" cy="264" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="730" y="268" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="60" y="316" font-size="13" font-weight="700">Client (messaging)</text>
    <text x="60" y="340" font-size="11" fill="#64748b" font-weight="700">Messaging hostname</text>
    <rect x="60" y="348" width="630" height="28" fill="#e2e8f0" rx="4" stroke="#e2e8f0"/>
    <text x="70" y="366" fill="#94a3b8">east.example.com</text>
    <text x="60" y="390" font-size="10" fill="#64748b">Follows the hostname above. Choose Appliance to set its own.</text>
    <circle cx="730" cy="362" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="730" y="366" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <text x="60" y="408" font-size="11" fill="#64748b" font-weight="700">Scheme</text>
    <rect x="60" y="416" width="130" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="70" y="434">wss (TLS)</text>
    <path d="M170 428 l4 4 l4 -4" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="200" y="408" font-size="11" fill="#64748b" font-weight="700">Port</text>
    <rect x="200" y="416" width="90" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="210" y="434">443</text>
    <circle cx="22" cy="430" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="22" y="434" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
    <text x="60" y="480" font-size="11" fill="#64748b" font-weight="700">Message VPNs (name / user / password)</text>
    <rect x="630" y="466" width="60" height="22" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="660" y="480.667" font-size="11" font-weight="700" text-anchor="middle">+ Add</text>
    <circle cx="730" cy="477" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="730" y="481" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
    <text x="60" y="508" font-size="11" fill="#64748b" font-weight="700">Message VPN</text>
    <text x="258" y="508" font-size="11" fill="#64748b" font-weight="700">Client username</text>
    <text x="456" y="508" font-size="11" fill="#64748b" font-weight="700">Client password</text>
    <rect x="60" y="516" width="190" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="70" y="534">default</text>
    <rect x="258" y="516" width="190" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="268" y="534">client-east</text>
    <rect x="456" y="516" width="190" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="466" y="534" fill="#94a3b8">password (blank = keep)</text>
    <text x="652" y="534" font-size="13" fill="#64748b" font-weight="700">x</text>
    <rect x="60" y="552" width="190" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="70" y="570">qa</text>
    <rect x="258" y="552" width="190" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="268" y="570">client?qa</text>
    <rect x="456" y="552" width="190" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="466" y="570" fill="#94a3b8">password (blank = keep)</text>
    <text x="652" y="570" font-size="13" fill="#64748b" font-weight="700">x</text>
    <circle cx="22" cy="544" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="22" y="548" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
    <rect x="60" y="604" width="70" height="26" fill="#00C895" rx="5"/>
    <text x="95" y="621" fill="#ffffff" font-weight="700" text-anchor="middle">Save</text>
    <rect x="138" y="604" width="70" height="26" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="173" y="621" font-weight="700" text-anchor="middle">Cancel</text>
    <circle cx="22" cy="617" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="22" y="621" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
    <text x="60" y="666" font-size="11" fill="#ef4444">VPN &quot;qa&quot;: Client username must not contain ? or *.</text>
    <circle cx="730" cy="662" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="730" y="666" font-weight="700" fill="#ffffff" text-anchor="middle">11</text>
