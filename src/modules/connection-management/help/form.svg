<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 708" width="760" height="708" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="760" height="708" fill="#f8fafc" rx="8"/>
    <rect x="40" y="20" width="670" height="668" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="60" y="54" font-size="16" font-weight="700">Edit connection &quot;east-prod&quot;</text>
    <text x="60" y="84" font-size="11" fill="#64748b" font-weight="700">Broker name</text>
    <rect x="60" y="92" width="300" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="70" y="110">east-prod</text>
    <text x="380" y="84" font-size="11" fill="#64748b" font-weight="700">Solace Event Broker Type</text>
    <rect x="380" y="93" width="220" height="26" fill="#f1f5f9" rx="5" stroke="#e2e8f0"/>
    <rect x="380" y="93" width="130" height="26" fill="#00C895" rx="5"/>
    <text x="445" y="110" fill="#ffffff" font-weight="700" text-anchor="middle">Software / Cloud</text>
    <text x="555" y="110" fill="#64748b" text-anchor="middle">Appliance</text>
    <text x="380" y="136" font-size="10" fill="#64748b">One host serves both management and messaging.</text>
    <circle cx="22" cy="106" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="22" y="110" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <circle cx="730" cy="106" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="730" y="110" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="60" y="168" font-size="13" font-weight="700">SEMP (management)</text>
    <text x="60" y="192" font-size="11" fill="#64748b" font-weight="700">Hostname</text>
    <rect x="60" y="200" width="630" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="70" y="218">east.example.com</text>
    <circle cx="730" cy="214" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="730" y="218" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
