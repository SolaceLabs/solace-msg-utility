<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="640" height="300" fill="#f8fafc" rx="8"/>
    <rect x="24" y="24" width="600" height="260" fill="#e2e8f0" rx="10"/>
    <rect x="20" y="20" width="600" height="260" fill="#ffffff" rx="10" stroke="#cbd5e1"/>
    <text x="44" y="58" font-size="16" font-weight="700">Copying...</text>
    <circle cx="580" cy="52" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="580" y="56" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="44" y="96" font-size="11" fill="#64748b" font-weight="700">Progress</text>
    <rect x="44" y="106" width="536" height="14" fill="#e2e8f0" rx="7"/>
    <rect x="44" y="106" width="322" height="14" fill="#00C895" rx="7"/>
    <circle cx="600" cy="113" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="600" y="117" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="44" y="144" font-size="11" fill="#64748b">29 / 48</text>
    <circle cx="120" cy="140" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="120" y="144" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="44" y="184" font-size="11" fill="#ef4444" font-style="italic">Error: ...</text>
    <text x="112" y="184" font-size="11" fill="#64748b" font-style="italic">(shown here only when the run fails)</text>
    <circle cx="370" cy="180" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="370" y="184" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <rect x="44" y="224" width="110" height="30" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="99" y="243" font-weight="700" text-anchor="middle">Cancel copy</text>
    <circle cx="176" cy="239" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="176" y="243" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
</svg>
