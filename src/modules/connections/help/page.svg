<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 656" width="760" height="656" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
