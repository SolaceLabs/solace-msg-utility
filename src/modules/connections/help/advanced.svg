<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="640" height="560" fill="#f8fafc" rx="8"/>
    <rect x="20" y="16" width="600" height="528" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="44" y="48" font-size="15" font-weight="700">Advanced Connection Settings</text>
    <text x="44" y="72" font-size="11" fill="#64748b" font-weight="700">Connect Retries</text>
    <rect x="44" y="80" width="300" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="54" y="98">0</text>
    <circle cx="560" cy="94" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="560" y="98" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="44" y="136" font-size="11" fill="#64748b" font-weight="700">Connect Timeout (ms)</text>
    <rect x="44" y="144" width="300" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="54" y="162">10000</text>
    <circle cx="560" cy="158" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="560" y="162" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="44" y="200" font-size="11" fill="#64748b" font-weight="700">Reconnect Retries</text>
    <rect x="44" y="208" width="300" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="54" y="226">1</text>
    <text x="358" y="226" font-size="11" fill="#64748b">-1 for infinite</text>
    <circle cx="560" cy="222" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="560" y="226" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="44" y="264" font-size="11" fill="#64748b" font-weight="700">Reconnect Wait (ms)</text>
    <rect x="44" y="272" width="300" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="54" y="290">3000</text>
    <circle cx="560" cy="286" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="560" y="290" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="44" y="328" font-size="11" fill="#64748b" font-weight="700">Max Messages per Queue</text>
    <rect x="44" y="336" width="300" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="54" y="354">100</text>
    <circle cx="560" cy="350" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="560" y="354" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="44" y="392" font-size="11" fill="#64748b" font-weight="700">Client Name Identifier</text>
    <rect x="44" y="400" width="300" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="54" y="418" font-family="Consolas, Menlo, monospace">0f3c9a52-7e1d-4b86-a5c0-d2e84b19f6a7</text>
    <circle cx="560" cy="414" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="560" y="418" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <rect x="44" y="478" width="80" height="26" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="84" y="495" font-weight="700" text-anchor="middle">Close</text>
    <circle cx="150" cy="491" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="150" y="495" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
</svg>
