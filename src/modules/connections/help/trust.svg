<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="640" height="540" fill="#f8fafc" rx="8"/>
    <rect x="20" y="16" width="600" height="52" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="36" y="46" fill="#ef4444">Connection Failed: Connection error</text>
    <text x="281.2" y="46" fill="#ef4444" font-weight="700">Trust Certificate?</text>
    <line x1="281.20000000000005" y1="49" x2="410.80000000000007" y2="49" stroke="#ef4444"/>
    <text x="416.8" y="46" fill="#ef4444">(or CORS)</text>
    <circle cx="590" cy="42" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="590" y="46" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="20" y="84" width="600" height="436" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="40" y="114" font-size="15" font-weight="700">Certificate Trust Helper</text>
    <rect x="578" y="98" width="24" height="24" fill="#ffffff" rx="4" stroke="#e2e8f0"/>
    <path d="M586 106 l8 8 M594 106 l-8 8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="40" y="144" font-size="11" fill="#64748b">The browser may have blocked the connection because the broker's certificate is</text>
    <text x="40" y="160" font-size="11" fill="#64748b">not trusted.</text>
    <rect x="40" y="174" width="560" height="84" fill="#f8fafc" rx="6" stroke="#e2e8f0"/>
    <text x="54" y="196" font-size="11">Step 1: Click the link below to open the broker in a new tab.</text>
    <text x="54" y="216" font-size="11">Step 2: If you see a privacy warning, click Advanced and then Proceed (or Accept).</text>
    <text x="54" y="236" font-size="11">Step 3: Once the page loads, close that tab and return here to connect.</text>
    <circle cx="580" cy="216" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="580" y="220" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="40" y="290" font-weight="700">Or it could be CORS</text>
    <rect x="40" y="300" width="560" height="100" fill="#f8fafc" rx="6" stroke="#e2e8f0"/>
    <text x="54" y="320" font-size="11">&quot;Failed to fetch&quot; can also mean the broker did not send an</text>
    <text x="54" y="336" font-size="11">Access-Control-Allow-Origin header that permits this page's origin.</text>
    <text x="54" y="352" font-size="11">If trusting the certificate doesn't fix it, ask your broker admin to enable CORS</text>
    <text x="54" y="368" font-size="11">for this page's origin:</text>
    <text x="54" y="388" font-size="11" fill="#009193" font-family="Consolas, Menlo, monospace">https://tools.example.com</text>
    <circle cx="580" cy="350" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="580" y="354" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="240" y="424" width="160" height="30" fill="#00C895" rx="5"/>
    <text x="320" y="443" fill="#ffffff" font-weight="700" text-anchor="middle">Open Broker URL</text>
    <circle cx="436" cy="439" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="436" y="443" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="320" y="480" font-size="11" fill="#64748b" text-anchor="middle">https://broker.example.com:1943</text>
    <circle cx="520" cy="476" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="520" y="480" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
</svg>
