<!-- Managed entry template (the `managed` variant). The build splices the
     Direct markup from index.html in at the module-base marker below. -->
<div id="conn-tabs" class="conn-tabs flex-row gap-2 mb-4 hidden" role="tablist">
    <button id="conn-tab-direct" class="btn btn-primary conn-tab" type="button" role="tab" data-conn-mode="direct" aria-selected="true">Direct</button>
    <button id="conn-tab-managed" class="btn btn-secondary conn-tab hidden" type="button" role="tab" data-conn-mode="managed" aria-selected="false">Managed</button>
</div>
<div id="conn-panel-direct" role="tabpanel">
<!-- @module-base -->
</div>
<!-- Managed connection panel: the gateway session's entitled broker/VPN
     selection. Only rendered when the gateway advertises managed mode via
     /hosted. Sign-in and password changes happen on the gateway's own pages. -->
<div id="conn-panel-managed" role="tabpanel" class="hidden">
    <!-- Signed-out view -->
    <div id="managed-login-view" class="card managed-conn-card">
        <div class="flex-row justify-between items-center mb-4">
            <h2 class="m-0">Sign in</h2>
        </div>
        <p class="text-secondary mb-4" style="line-height: 1.5;">
            Sign in with your managed account to connect to the brokers you are entitled to.
        </p>
        <div id="managed-login-error" class="text-error mb-4 hidden" style="font-size: 0.9rem;"></div>
        <a id="btn-managed-login" class="btn btn-primary" href="/login">Sign in</a>
    </div>

    <!-- Selection view -->
    <div id="managed-select-view" class="card managed-conn-card hidden">
        <div class="flex-row justify-between items-center mb-4">
            <h2 class="m-0">Connect to a broker</h2>
            <div class="flex-row items-center gap-4">
                <button id="btn-managed-refresh" class="btn btn-secondary" title="Re-fetch your available connections">Refresh</button>
            </div>
        </div>

        <div id="managed-empty-state" class="text-secondary hidden" style="line-height: 1.5;">
            No connections are available for your account. Ask an administrator to grant access.
        </div>

        <div id="managed-connect-controls">
            <div class="form-group flex-row">
                <div class="w-full">
                    <label for="managed-broker-select">Broker</label>
                    <select id="managed-broker-select" class="form-control"></select>
                </div>
                <div class="w-full">
                    <label for="managed-vpn-select">Message VPN</label>
                    <select id="managed-vpn-select" class="form-control" disabled></select>
                </div>
            </div>
            <button id="btn-managed-connect" class="btn btn-primary" disabled>Connect</button>
            <div id="managed-connect-error" class="text-error mt-2 hidden" style="font-size: 0.9rem;"></div>
        </div>
    </div>

    <!-- Connected view -->
    <div id="managed-connected-view" class="card managed-conn-card hidden">
        <div class="flex-row justify-between items-center mb-4">
            <h2 class="m-0">Connected</h2>
            <button id="btn-managed-disconnect" class="btn btn-danger">Disconnect</button>
        </div>
        <div id="managed-connected-summary" class="text-secondary"></div>
    </div>
</div>
