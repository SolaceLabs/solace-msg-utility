<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="640" height="540" fill="#f8fafc" rx="8"/>
    <rect x="24" y="24" width="600" height="500" fill="#e2e8f0" rx="10"/>
    <rect x="20" y="20" width="600" height="500" fill="#ffffff" rx="10" stroke="#cbd5e1"/>
    <text x="44" y="58" font-size="16" font-weight="700">Filter Messages</text>
    <text x="44" y="92" font-weight="700">Search Criteria:</text>
    <circle cx="178" cy="88" r="6" fill="#ffffff" stroke="#00C895" stroke-width="1.5"/>
    <circle cx="178" cy="88" r="3" fill="#00C895"/>
    <text x="190" y="92">Match ANY (OR)</text>
    <circle cx="306" cy="88" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="318" y="92">Match ALL (AND)</text>
    <circle cx="600" cy="88" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="600" y="92" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="44" y="124" font-size="11" fill="#64748b" font-weight="700">Message ID</text>
    <rect x="44" y="132" width="350" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="54" y="150" fill="#94a3b8">e.g. 1023</text>
    <text x="404" y="124" font-size="11" fill="#64748b" font-weight="700">Message Type</text>
    <rect x="404" y="132" width="176" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="414" y="150">Any</text>
    <path d="M560 144 l4 4 l4 -4" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="600" cy="146" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="600" y="150" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="44" y="180" font-size="11" fill="#64748b" font-weight="700">Destination Name</text>
    <rect x="44" y="188" width="390" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="54" y="206">orders/eu/*</text>
    <text x="444" y="180" font-size="11" fill="#64748b" font-weight="700">Type</text>
    <rect x="444" y="188" width="136" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="454" y="206">Topic</text>
    <path d="M560 200 l4 4 l4 -4" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="600" cy="202" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="600" y="206" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="44" y="240" font-size="11" fill="#64748b" font-weight="700">Properties Filter (Key / Value)</text>
    <rect x="528" y="226" width="52" height="22" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="554" y="240.667" font-size="11" font-weight="700" text-anchor="middle">+ Add</text>
    <rect x="44" y="248" width="190" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="54" y="266">Corr Id</text>
    <rect x="242" y="248" width="338" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="252" y="266">ord-7781</text>
    <circle cx="600" cy="262" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="600" y="266" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="44" y="300" font-size="11" fill="#64748b" font-weight="700">Body Content (Contains)</text>
    <rect x="44" y="308" width="536" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="54" y="326" fill="#94a3b8">e.g. orderId</text>
    <circle cx="600" cy="322" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="600" y="326" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <line x1="44" y1="352" x2="580" y2="352" stroke="#e2e8f0"/>
    <text x="44" y="378" font-weight="700">Search Time Range:</text>
    <text x="44" y="400" font-size="11" fill="#64748b" font-weight="700">Newer than (inclusive) - hh:mm:ss</text>
    <rect x="44" y="408" width="262" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="54" y="426">14/03/2026, 09:00:00</text>
    <text x="318" y="400" font-size="11" fill="#64748b" font-weight="700">Older than (inclusive) - hh:mm:ss</text>
    <rect x="318" y="408" width="262" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="328" y="426" fill="#94a3b8">dd/mm/yyyy, --:--:--</text>
    <circle cx="600" cy="422" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="600" y="426" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <rect x="44" y="468" width="100" height="26" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="94" y="485" fill="#ef4444" font-weight="700" text-anchor="middle">Clear Filter</text>
    <rect x="408" y="468" width="66" height="26" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="441" y="485" font-weight="700" text-anchor="middle">Cancel</text>
    <rect x="480" y="468" width="100" height="26" fill="#00C895" rx="5"/>
    <text x="530" y="485" fill="#ffffff" font-weight="700" text-anchor="middle">Apply Filter</text>
    <circle cx="600" cy="481" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="600" y="485" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
</svg>
