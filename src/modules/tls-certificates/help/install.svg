<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="640" height="230" fill="#f8fafc" rx="8"/>
    <rect x="30" y="20" width="580" height="190" fill="#ffffff" rx="8" stroke="#cbd5e1"/>
    <text x="54" y="54">Install this certificate? Subject: CN=gateway.example.org, O=Example.</text>
    <text x="54" y="72">Valid to 2027-12-01 00:00 UTC. Fingerprint (SHA-256): 3A:9F:C2:1B:7E:44...</text>
    <text x="54" y="90">It replaces the gateway's certificate at once; open connections carry on.</text>
    <circle cx="590" cy="60" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="590" y="64" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="380" y="150" width="90" height="30" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="425" y="169" font-weight="700" text-anchor="middle">Cancel</text>
    <rect x="480" y="150" width="100" height="30" fill="#00C895" rx="5"/>
    <text x="530" y="169" fill="#ffffff" font-weight="700" text-anchor="middle">Install</text>
    <circle cx="350" cy="165" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="350" y="169" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <circle cx="598" cy="165" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="598" y="169" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
</svg>
