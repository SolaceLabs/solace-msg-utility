<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="760" height="470" fill="#f8fafc" rx="8"/>
    <rect x="20" y="16" width="720" height="150" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="38" y="44" font-size="14" font-weight="700">Gateway certificate</text>
    <text x="38" y="68" font-size="11.5" fill="#64748b">Subject</text>
    <text x="190" y="68" font-size="11.5">CN=gateway.example.org, O=Example</text>
    <text x="38" y="88" font-size="11.5" fill="#64748b">Valid to</text>
    <text x="190" y="88" font-size="11.5">2027-12-01 00:00 UTC</text>
    <rect x="38" y="100" width="640" height="26" fill="#fffbeb" rx="6" stroke="#fcd34d"/>
    <text x="50" y="117" font-size="10.5" fill="#b45309">The certificate files are read-only on the gateway host, so the certificate cannot be replaced here.</text>
    <circle cx="716" cy="113" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="117" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="38" y="134" width="150" height="24" fill="#ffffff" rx="5" stroke="#e2e8f0"/>
    <text x="113" y="150" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="middle">Replace certificate</text>
    <circle cx="212" cy="146" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="212" y="150" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="20" y="176" width="720" height="160" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="38" y="204" font-size="14" font-weight="700">Trusted broker CAs</text>
    <rect x="38" y="216" width="640" height="26" fill="#fffbeb" rx="6" stroke="#fcd34d"/>
    <text x="50" y="233" font-size="10.5" fill="#b45309">The trust files are read-only on the gateway host, so CA certificates cannot be added or deleted here.</text>
    <circle cx="716" cy="229" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="233" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="50" y="266" font-weight="700">east-prod-ca.pem</text>
    <rect x="598" y="252" width="66" height="24" fill="#ffffff" rx="5" stroke="#e2e8f0"/>
    <text x="631" y="268" fill="#94a3b8" font-weight="700" text-anchor="middle">Delete</text>
    <circle cx="716" cy="264" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="268" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <rect x="38" y="296" width="150" height="26" fill="#ffffff" rx="5" stroke="#e2e8f0"/>
    <text x="113" y="313" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="middle">Add CA certificate</text>
    <circle cx="212" cy="309" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="212" y="313" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <rect x="20" y="346" width="720" height="110" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="38" y="374" font-size="14" font-weight="700">Standard root CAs</text>
    <text x="38" y="396" font-size="11" fill="#64748b">Not trusted: turned off on Gateway Settings. Only the CA files above are trusted.</text>
    <text x="38" y="418" font-size="11" fill="#ef4444">The standard root CA bundle cannot be read.</text>
    <circle cx="716" cy="394" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="398" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <circle cx="716" cy="424" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="428" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
</svg>
