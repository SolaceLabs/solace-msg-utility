<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="760" height="700" fill="#f8fafc" rx="8"/>
    <rect x="20" y="16" width="720" height="58" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="38" y="40" font-size="11.5" fill="#64748b">The gateway's own certificate, and the CA certificates it trusts for brokers.</text>
    <text x="38" y="58" font-size="11.5" fill="#64748b">A change applies at once: new connections use it, open ones carry on.</text>
    <rect x="650" y="33" width="72" height="26" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="686" y="50" font-weight="700" text-anchor="middle">Reload</text>
    <circle cx="626" cy="45" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="626" y="49" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="20" y="84" width="720" height="190" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="38" y="110" font-size="14" font-weight="700">Gateway certificate</text>
    <text x="38" y="134" font-size="11.5" fill="#64748b">Subject</text>
    <text x="190" y="134" font-size="11.5">CN=gateway.example.org, O=Example</text>
    <text x="38" y="154" font-size="11.5" fill="#64748b">Names</text>
    <text x="190" y="154" font-size="11.5">gateway.example.org, 10.0.4.2</text>
    <text x="38" y="174" font-size="11.5" fill="#64748b">Issuer</text>
    <text x="190" y="174" font-size="11.5">CN=gateway.example.org, O=Example</text>
    <text x="38" y="194" font-size="11.5" fill="#64748b">Valid from</text>
    <text x="190" y="194" font-size="11.5">2025-12-01 00:00 UTC</text>
    <text x="38" y="214" font-size="11.5" fill="#64748b">Valid to</text>
    <text x="190" y="214" font-size="11.5">2026-12-01 00:00 UTC</text>
    <rect x="330.8" y="201" width="118" height="18" fill="#fffbeb" rx="9" stroke="#b45309"/>
    <text x="389.8" y="213.5" font-size="10" fill="#b45309" font-weight="700" text-anchor="middle">Expires in 9 days</text>
    <text x="38" y="234" font-size="11.5" fill="#64748b">Fingerprint (SHA-256)</text>
    <text x="190" y="234" font-size="10.5" font-family="Consolas, Menlo, monospace">3A:9F:C2:1B:7E:44:D0:58:A6:0C:E1:92:5B:F7:23:8D:...</text>
    <text x="38" y="258" font-size="10.5" fill="#64748b">This certificate is self-signed ... Browsers warn about it until it is replaced.</text>
    <circle cx="716" cy="160" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="164" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <circle cx="716" cy="214" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="218" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <circle cx="716" cy="255" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="259" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <rect x="20" y="284" width="720" height="150" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="38" y="310" font-size="14" font-weight="700">Replace certificate</text>
    <text x="38" y="334" font-size="11" fill="#64748b" font-weight="700">Certificate file</text>
    <rect x="38" y="340" width="300" height="26" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="48" y="357">Choose file</text>
    <text x="372" y="334" font-size="11" fill="#64748b" font-weight="700">Key file</text>
    <rect x="372" y="340" width="300" height="26" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="382" y="357">Choose file</text>
    <rect x="38" y="374" width="300" height="26" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <rect x="372" y="374" width="300" height="26" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <rect x="38" y="402" width="150" height="26" fill="#00C895" rx="5"/>
    <text x="113" y="419" fill="#ffffff" font-weight="700" text-anchor="middle">Replace certificate</text>
    <circle cx="355" cy="353" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="355" y="357" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <circle cx="716" cy="387" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="391" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <circle cx="212" cy="415" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="212" y="419" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
    <rect x="20" y="444" width="720" height="130" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="38" y="470" font-size="14" font-weight="700">Trusted broker CAs</text>
    <rect x="38" y="480" width="640" height="38" fill="#f8fafc" rx="6" stroke="#e2e8f0"/>
    <text x="50" y="496" font-weight="700">east-prod-ca.pem</text>
    <text x="50" y="511" font-size="9.5" fill="#64748b">CN=East Prod CA: valid to 2030-05-01 00:00 UTC; SHA-256 B1:6C:0E:A4:73:D9:2F:85...</text>
    <rect x="598" y="487" width="66" height="24" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="631" y="503" font-weight="700" text-anchor="middle">Delete</text>
    <circle cx="716" cy="499" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="503" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
    <text x="38" y="540" font-weight="700">Add CA certificate</text>
    <rect x="38" y="546" width="300" height="22" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="48" y="561">Choose file</text>
    <rect x="372" y="546" width="190" height="22" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="382" y="561" fill="#94a3b8">my-ca.crt</text>
    <rect x="584" y="545" width="140" height="24" fill="#00C895" rx="5"/>
    <text x="654" y="560.667" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">Add CA certificate</text>
    <circle cx="354" cy="557" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="354" y="561" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
    <rect x="20" y="584" width="720" height="104" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="38" y="610" font-size="14" font-weight="700">Standard root CAs</text>
    <text x="38" y="632" font-size="11" fill="#64748b">Trusted: brokers whose certificates chain to one of these 140 certificates are accepted.</text>
    <text x="38" y="654" font-size="11" font-weight="700">&gt; Show the 140 certificates</text>
    <circle cx="716" cy="636" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="640" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
</svg>
