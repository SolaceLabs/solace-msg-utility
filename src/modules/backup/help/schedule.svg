<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="760" height="480" fill="#f8fafc" rx="8"/>
    <rect x="20" y="20" width="720" height="440" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="40" y="50" font-size="15" font-weight="700">Schedule</text>
    <rect x="652" y="34" width="68" height="26" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="686" y="51" font-weight="700" text-anchor="middle">Reload</text>
    <text x="40" y="76" font-size="11" fill="#64748b">The gateway writes each backup into its backup directory, which you mount from the host. Times are UTC.</text>
    <text x="40" y="100" font-size="11" fill="#64748b">Weekly on Monday at 02:15 UTC; keeps the last 14. Next backup: 2026-11-23 02:15 UTC.</text>
    <text x="40" y="116" font-size="11" fill="#64748b">Last backup: smu-backup-20261116T021500Z.json, 2026-11-16 02:15 UTC.</text>
    <circle cx="716" cy="108" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="112" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="40" y="146" font-size="11" fill="#64748b" font-weight="700">Frequency</text>
    <rect x="40" y="152" width="150" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="50" y="170">Weekly</text>
    <path d="M170 164 l4 4 l4 -4" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="206" y="146" font-size="11" fill="#64748b" font-weight="700">Day of the week</text>
    <rect x="206" y="152" width="160" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="216" y="170">Monday</text>
    <path d="M346 164 l4 4 l4 -4" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="382" y="146" font-size="11" fill="#64748b" font-weight="700">Time (UTC)</text>
    <rect x="382" y="152" width="110" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="392" y="170">02:15</text>
    <circle cx="520" cy="166" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="520" y="170" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="40" y="200" font-size="11" fill="#64748b" font-weight="700">Backups to keep</text>
    <rect x="40" y="206" width="120" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="50" y="224">14</text>
    <circle cx="182" cy="220" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="182" y="224" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="216" y="200" font-size="11" fill="#64748b" font-weight="700">Passphrase</text>
    <rect x="216" y="206" width="220" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="226" y="224">............</text>
    <text x="452" y="200" font-size="11" fill="#64748b" font-weight="700">Confirm the passphrase</text>
    <rect x="452" y="206" width="220" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="462" y="224">............</text>
    <text x="216" y="252" font-size="10.5" fill="#64748b">Leave blank to keep the current passphrase.</text>
    <circle cx="704" cy="220" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="704" y="224" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <rect x="40" y="272" width="112" height="26" fill="#00C895" rx="5"/>
    <text x="96" y="289" fill="#ffffff" font-weight="700" text-anchor="middle">Save schedule</text>
    <rect x="160" y="272" width="104" height="26" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="212" y="289" font-weight="700" text-anchor="middle">Back up now</text>
    <rect x="272" y="272" width="126" height="26" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="335" y="289" fill="#ef4444" font-weight="700" text-anchor="middle">Remove schedule</text>
    <circle cx="418" cy="285" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="418" y="289" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="40" y="336" font-size="13" font-weight="700">Saved backups</text>
    <rect x="40" y="346" width="680" height="98" fill="#ffffff" rx="6" stroke="#e2e8f0"/>
    <rect x="41" y="347" width="678" height="28" fill="#f1f5f9"/>
