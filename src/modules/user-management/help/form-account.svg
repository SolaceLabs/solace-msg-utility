    <text x="400" y="74" font-size="11" fill="#64748b" font-weight="700">Password </text>
    <text x="459.4" y="74" font-size="11" fill="#64748b">(leave blank to keep current)</text>
    <rect x="400" y="82" width="290" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
