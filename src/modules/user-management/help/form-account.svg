    <text x="730" y="100" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="40" y="127" width="30" height="16" fill="#00C895" rx="8"/>
    <circle cx="62" cy="135" r="6" fill="#ffffff"/>
