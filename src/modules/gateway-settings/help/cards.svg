<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="760" height="620" fill="#f8fafc" rx="8"/>
    <rect x="20" y="16" width="720" height="190" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="38" y="42" font-size="14" font-weight="700">Access</text>
    <text x="38" y="60" font-size="11" fill="#64748b">Your address as the gateway sees it: 10.0.4.17 (from X-Forwarded-For, sent by the trusted proxy 10.0.4.2).</text>
    <circle cx="716" cy="46" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="50" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="38" y="78" font-size="11" fill="#64748b" font-weight="700">Allowed clients: CIDR ranges, one per line (empty admits every client)</text>
    <rect x="38" y="86" width="640" height="44" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="48" y="112" font-family="Consolas, Menlo, monospace">10.0.0.0/8</text>
    <circle cx="716" cy="108" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="112" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="38" y="150" font-size="11" fill="#64748b" font-weight="700">Trusted reverse proxies: CIDR ranges, one per line</text>
    <rect x="38" y="158" width="640" height="36" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="48" y="180" font-family="Consolas, Menlo, monospace">10.0.4.2/32</text>
    <circle cx="716" cy="176" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="180" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="20" y="216" width="720" height="168" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="38" y="242" font-size="14" font-weight="700">Modules</text>
    <text x="38" y="254" font-size="11" fill="#64748b" font-weight="700">Modules signed-in users may be given</text>
    <rect x="38" y="264" width="200" height="58" fill="#f8fafc" rx="6" stroke="#00C895" stroke-width="2"/>
    <text x="50" y="285" font-weight="700">[x] Queue Browser</text>
    <text x="50" y="304" font-size="9" fill="#64748b">Browse, inspect and delete ...</text>
    <rect x="250" y="264" width="200" height="58" fill="#f8fafc" rx="6" stroke="#00C895" stroke-width="2"/>
    <text x="262" y="285" font-weight="700">[x] Queue Copy</text>
    <text x="262" y="304" font-size="9" fill="#64748b">Copy or move messages ...</text>
    <rect x="462" y="264" width="200" height="58" fill="#f8fafc" rx="6" stroke="#e2e8f0"/>
    <text x="474" y="285" font-weight="700">[ ] Queue Subscriptions</text>
    <text x="474" y="304" font-size="9" fill="#64748b">See which topics each ...</text>
    <circle cx="716" cy="293" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="297" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="38" y="346" font-size="11" fill="#64748b" font-weight="700">A user without a list of their own gets</text>
    <rect x="300" y="332" width="250" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="310" y="350">Every offered module</text>
    <path d="M530 344 l4 4 l4 -4" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="716" cy="346" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="350" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <rect x="20" y="394" width="720" height="216" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="38" y="420" font-size="14" font-weight="700">Audit trail</text>
    <text x="38" y="430" font-size="11" fill="#64748b">The audit trail itself is always written to /data/audit.log on the gateway; these settings only add to it.</text>
    <rect x="38" y="446" width="14" height="14" fill="#ffffff" rx="3" stroke="#cbd5e1"/>
    <text x="60" y="458">Copy audit lines to the gateway log (stdout)</text>
    <circle cx="716" cy="453" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="457" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <rect x="38" y="478" width="14" height="14" fill="#00C895" rx="3"/>
    <path d="M41 485.5 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <text x="60" y="490">Also audit broker access: dials, SMF sockets and SEMP relay requests</text>
    <circle cx="716" cy="485" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="489" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
    <text x="38" y="524" font-size="11" fill="#64748b" font-weight="700">If the audit log cannot be written</text>
    <rect x="38" y="532" width="340" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="48" y="550">Carry on, and log the lost record</text>
    <path d="M358 544 l4 4 l4 -4" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="716" cy="546" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="550" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
</svg>
