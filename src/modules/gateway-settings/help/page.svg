<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="760" height="640" fill="#f8fafc" rx="8"/>
    <rect x="20" y="16" width="720" height="64" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="38" y="42" font-size="11.5" fill="#64748b">The gateway's settings. A saved setting applies at once.</text>
    <text x="38" y="60" font-size="11.5" fill="#64748b">Certificates are managed under Certificates.</text>
    <rect x="650" y="33" width="72" height="26" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
