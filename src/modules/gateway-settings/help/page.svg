    <rect x="20" y="90" width="720" height="34" fill="#fffbeb" rx="6" stroke="#fcd34d"/>
    <text x="36" y="112" font-size="11" fill="#b45309">config.yaml was edited on the gateway host since the gateway loaded it. Restart the gateway ...</text>
    <circle cx="716" cy="107" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="716" y="111" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
