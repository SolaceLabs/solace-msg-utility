    <text x="372" y="172" font-size="11" fill="#64748b" font-weight="700">Tab shown first when both are offered</text>
    <rect x="372" y="180" width="300" height="28" fill="#f1f5f9" rx="4" stroke="#e2e8f0"/>
    <text x="382" y="198">Direct</text>
