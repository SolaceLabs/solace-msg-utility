<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="640" height="400" fill="#f8fafc" rx="8"/>
    <rect x="20" y="16" width="600" height="150" fill="#ffffff" rx="8" stroke="#e2e8f0"/>
    <text x="38" y="42" font-size="14" font-weight="700">Gateway</text>
    <text x="38" y="59" font-size="11" fill="#64748b">Restart starts the gateway's program again in place, with the same arguments and</text>
    <text x="38" y="74" font-size="11" fill="#64748b">environment. Everyone is signed out and open broker connections close.</text>
    <rect x="38" y="86" width="130" height="30" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="103" y="105" fill="#ef4444" font-weight="700" text-anchor="middle">Restart gateway</text>
    <circle cx="196" cy="101" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="196" y="105" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="38" y="122" width="560" height="30" fill="#fffbeb" rx="6" stroke="#fcd34d"/>
    <text x="50" y="142" font-size="10.5" fill="#b45309">Restarting the gateway. This page goes to the sign-in when the gateway answers again.</text>
    <circle cx="612" cy="137" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="612" y="141" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="70" y="190" width="500" height="190" fill="#ffffff" rx="8" stroke="#cbd5e1"/>
    <text x="94" y="228">Restart the gateway? Everyone is signed out and open</text>
    <text x="94" y="246">broker connections close. It is back in a few seconds.</text>
    <rect x="340" y="330" width="90" height="30" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="385" y="349" font-weight="700" text-anchor="middle">Cancel</text>
    <rect x="436" y="330" width="124" height="30" fill="#ffffff" rx="5" stroke="#cbd5e1"/>
    <text x="498" y="349" fill="#ef4444" font-weight="700" text-anchor="middle">Restart gateway</text>
    <circle cx="54" cy="237" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="54" y="241" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <circle cx="310" cy="345" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="310" y="349" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <circle cx="592" cy="345" r="11" fill="#093B5F" stroke="#ffffff" stroke-width="2"/>
    <text x="592" y="349" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
</svg>
