# Solace Message Utility — single-binary HTTPS gateway.
#
# Brings up the go-web-proxy container that serves the PWA, exposes /hosted,
# and reverse-proxies SEMP / SMF traffic. See docs/deployment.md for the full
# environment reference.
#
# Usage:
#   docker compose up --build       # build and run in foreground
#   docker compose up -d --build    # detached
#   docker compose logs -f gateway  # follow logs
#   docker compose down             # stop and remove containers (keeps the volumes)
#   docker compose down -v          # also remove the volumes: config.yaml is re-seeded
#                                   # from the environment, the managed store bootstraps again
#
# After it's up: open https://localhost:9443/
name: sol-msg-util-svc
services:
  gateway:
    build:
      # Build context is the project root (one level up from this compose file)
      # so the Dockerfile's COPYs can reach go-web-proxy/, src/, package.json,
      # solclient.js, etc. Docker disallows COPY paths that escape the context.
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # scripts/dev.sh derives this from the git tag and exports it; a bare
        # `docker compose build` falls back to the placeholder.
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    image: ghcr.io/solacelabs/solace-msg-utility:latest
    container_name: solace-message-utility
    restart: unless-stopped
    ports:
      - "19443:9443"
    environment:
      # These SEED config.yaml on the first start only. Afterwards the file in
      # the gateway-config volume is authoritative: edit it and restart; a
      # changed value here is logged as ignored. See docs/deployment.md.
      # Enables the /hosted probe so the PWA knows it's running behind the gateway.
      HOSTED: "true"
      # Log level: debug | info | warn | error. Bump to info/debug while testing.
      LOG_LEVEL: warn
      # Set to "true" ONLY for lab use against brokers with untrusted certs.
      SSL_INSECURE_SKIP_VERIFY: "true"
      # APP_DIR, SSL_CERT_FILE, SSL_KEY_FILE, SSL_TRUST_DIR all use their defaults.
      # Override here if you mount the PWA or TLS material at non-default paths.
    volumes:
      # Named volume so the non-root UID (65532) inside the container can write
      # the self-signed cert on first boot. To use your own cert/key, drop them
      # into this volume (or replace with a bind mount whose host directory is
      # owned by UID 65532) before first start.
      #- tls:/tls
      # config.yaml lives here. The named volume inherits the baked /managed
      # dir's UID-65532 ownership so the gateway can write the file on the first
      # start; without the volume it would be re-seeded on every recreate.
      - gateway-config:/managed
      # Optional: bind-mount your own PWA bundle. Comment out to use the bundle
      # baked into the image at /SolaceMsgUtility.
      # - ../dist:/SolaceMsgUtility:ro
      - ../dist/solclient.js:/SolaceMsgUtility/solclient.js:ro
      - ../dist/jszip.min.js:/SolaceMsgUtility/jszip.min.js:ro
    # No HEALTHCHECK: the scratch image has no shell or curl. Use an external
    # check (k8s liveness probe, docker swarm, monitoring agent) hitting
    # https://<host>:9443/hosted with TLS verification disabled or pinned.

  # Managed (RBAC) deployment: the managed bundle (managed.html, served as
  # index.html) with MANAGED/HOSTED/CONN_MODES baked into the image (via the
  # build args below) so it offers the Managed sign-in instead of the Direct form. Exposed on a
  # different host port so it can run alongside the standard gateway. Open
  # https://localhost:29443/ — bootstrap admin is admin / msgutility (change it).
  # Administration lives at https://localhost:29443/solAdmin.
  gateway-managed:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Bake the runtime flags so the image is a self-contained managed
        # deployment. GO_TAGS=managed compiles the RBAC store + /managed/*
        # handler into the gateway binary (the standard gateway omits it).
        # MANAGED_UI serves managed.html as index.html and ships solAdmin.html,
        # which only a managed image has any use for.
        MANAGED: "true"
        HOSTED: "true"
        CONN_MODES: managed
        GO_TAGS: managed
        MANAGED_UI: "true"
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    image: ghcr.io/solacelabs/solace-msg-utility:managed-latest
    container_name: solace-message-utility-managed
    restart: unless-stopped
    ports:
      - "29443:9443"
    environment:
      # MANAGED and HOSTED are baked into the image; only the operational knobs
      # are set here. Like the baked values they seed config.yaml on the first
      # start only; afterwards the file in the managed volume wins.
      LOG_LEVEL: warn
      SSL_INSECURE_SKIP_VERIFY: "true"
    volumes:
      # Writable gateway store. The named volume inherits the baked /managed
      # dir's UID-65532 ownership, so the gateway can write config.yaml,
      # users.yaml + site.seed on first run. `docker compose down -v` wipes it
      # (re-seeds the config and forces a fresh bootstrap).
      - managed:/managed
      - ../dist/solclient.js:/SolaceMsgUtility/solclient.js:ro
      - ../dist/jszip.min.js:/SolaceMsgUtility/jszip.min.js:ro

volumes:
  gateway-config:
  managed:
