# Solace Message Utility -- the gateway image, built from this checkout, for
# local runs (`./scripts/dev.sh image`, `up`, `down`). To deploy a published
# release, use docker/compose.gateway.yaml or docker/compose.provisioned.yaml
# instead; see docs/deployment.md.
#
# One image, two services: `gateway` in Gateway mode (the default) and
# `provisioned` in Provisioned mode (CONN_MODES=provisioned), on different host
# ports so both can run at once.
#
# Usage:
#   docker compose up --build       # build and run in foreground
#   docker compose up -d --build    # detached
#   docker compose logs -f gateway  # follow logs
#   docker compose down             # stop and remove containers (keeps the volumes)
#   docker compose down -v          # also remove the volumes: config.yaml is re-seeded
#                                   # from the environment, the Provisioned stores bootstrap again
#
# Posture, both services: non-root UID 65532, privileged off, every capability
# dropped, no new privileges, read-only root filesystem, the default bridge
# network. The gateway writes only /tls (a self-signed certificate on the first
# start) and /data, both named volumes that inherit the image's UID-65532
# ownership.
name: sol-msg-util-svc
services:
  gateway:
    build:
      # Build context is the project root (one level up from this compose file)
      # so the Dockerfile's COPYs can reach go-web-proxy/, src/, package.json,
      # etc. Docker disallows COPY paths that escape the context.
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # scripts/dev.sh derives this from the git tag and exports it; a bare
        # `docker compose build` falls back to the placeholder.
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    image: ghcr.io/solacelabs/solace-msg-utility:latest
    container_name: solace-message-utility
    user: "65532:65532"
    privileged: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "19443:9443"
    environment:
      # These SEED config.yaml on the first start only. Afterwards the file in
      # the gateway-data volume is authoritative: edit it and restart; a
      # changed value here is logged as ignored. See docs/deployment.md.
      # Log level: debug | info | warn | error. Bump to info/debug while testing.
      LOG_LEVEL: warn
      # Set to "true" ONLY for lab use against brokers with untrusted certs.
      SSL_INSECURE_SKIP_VERIFY: "true"
      # APP_DIR, SSL_CERT_FILE, SSL_KEY_FILE, SSL_TRUST_DIR all use their defaults.
      # Override here if you mount the PWA or TLS material at non-default paths.
    volumes:
      # The self-signed certificate is written here on the first start. To use
      # your own, put tls.crt and tls.key (and CAs under trust/) into this
      # volume before the first start.
      - gateway-tls:/tls
      # config.yaml lives here; without the volume it would be re-seeded on
      # every recreate.
      - gateway-data:/data
      # Optional: bind-mount your own PWA bundles. Comment out to use the ones
      # baked into the image at /SolaceMsgUtility.
      # - ../dist:/SolaceMsgUtility:ro
    # No HEALTHCHECK: the scratch image has no shell or curl. Use an external
    # check (k8s liveness probe, docker swarm, monitoring agent) hitting
    # https://<host>:9443/hosted with TLS verification disabled or pinned.

  # Provisioned mode: the same image with CONN_MODES=provisioned. Open
  # https://localhost:29443/ (it redirects to the sign-in page). The first start
  # creates the user "admin" with ADMIN_PASSWORD, or with a generated password
  # printed once in `docker compose logs provisioned`; either way it must be
  # changed at the first sign-in. The admin console is at
  # https://localhost:29443/solAdmin.
  provisioned:
    image: ghcr.io/solacelabs/solace-msg-utility:latest
    # The image the gateway service builds, never a published one.
    pull_policy: never
    container_name: solace-message-utility-provisioned
    user: "65532:65532"
    privileged: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "29443:9443"
    environment:
      # Seeds config.yaml on the first start only, like the values above.
      CONN_MODES: provisioned
      LOG_LEVEL: warn
      SSL_INSECURE_SKIP_VERIFY: "true"
      # Bootstrap admin password, read only when users.yaml does not exist yet
      # (12 to 128 characters). Put it in a .env file next to this one rather
      # than here; never written to config.yaml or the log. For a Docker secret
      # set ADMIN_PASSWORD_FILE to its path instead.
      # ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - provisioned-tls:/tls
      # config.yaml, users.yaml, connections.yaml and store.key. The store key
      # encrypts the two stores: back it up, or set STORE_KEY_FILE to a separate
      # mount. `docker compose down -v` wipes it all (re-seeds the config and
      # forces a fresh bootstrap).
      - provisioned-data:/data

volumes:
  gateway-tls:
  gateway-data:
  provisioned-tls:
  provisioned-data:
