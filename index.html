</fieldset>

<!-- Confirm Queue Copy modal -->
<dialog id="copy-modal" aria-labelledby="copy-modal-title">
    <div class="copy-modal-body">
        <h3 id="copy-modal-title" class="m-0 mb-4">Confirm Queue Copy</h3>

        <!-- Verification phase -->
        <div id="copy-modal-verify" class="copy-modal-section">
            <div class="copy-modal-block">
                <div class="flex-row justify-between items-center mb-2">
                    <h4 class="m-0 text-secondary">Source</h4>
                    <button id="copy-modal-source-refresh" type="button" class="btn btn-secondary"
                        title="Re-run verification" aria-label="Refresh source queue stats" disabled>
                        Refresh
                    </button>
                </div>
                <dl class="copy-modal-dl">
                    <dt>Broker</dt>
                    <dd id="copy-modal-source-broker">—</dd>
                    <dt>Message VPN</dt>
                    <dd id="copy-modal-source-vpn">—</dd>
                    <dt>Queue</dt>
                    <dd id="copy-modal-source-name">—</dd>
                    <dt>Queue Usage</dt>
                    <dd id="copy-modal-source-usage">—</dd>
                    <dt>Message Count</dt>
                    <dd id="copy-modal-source-count">—</dd>
                    <!-- Max Message Size is hidden when verification fell back to
                         QueueBrowser-accumulate (no SEMP), since the broker doesn't
                         report it via the message stream. The dt+dd pair is hidden
                         together via the wrapping element. -->
                    <dt id="copy-modal-source-max-size-label">Max Message Size</dt>
                    <dd id="copy-modal-source-max-size">—</dd>
                    <dt>Oldest Msg ID</dt>
                    <dd id="copy-modal-source-oldest-id">—</dd>
                    <dt>Newest Msg ID</dt>
                    <dd id="copy-modal-source-newest-id">—</dd>
                    <dt>Status</dt>
                    <dd id="copy-modal-source-status" class="text-secondary">Checking…</dd>
                </dl>
            </div>

            <div class="copy-modal-block">
                <h4 class="m-0 mb-2 text-secondary">Destination</h4>
                <dl class="copy-modal-dl">
                    <dt>Broker</dt>
                    <dd id="copy-modal-dest-broker">—</dd>
                    <dt>Message VPN</dt>
                    <dd id="copy-modal-dest-vpn">—</dd>
                    <dt>Type</dt>
                    <dd id="copy-modal-dest-type">—</dd>
                    <dt id="copy-modal-dest-name-label">Name</dt>
                    <dd id="copy-modal-dest-name">—</dd>
                </dl>
            </div>

            <div id="copy-modal-verify-error" class="text-error mt-2 hidden text-body-sm"></div>

            <!-- Verify-phase red banners. The modal's evaluateStartGate
                 toggles these based on the verify result and selected mode:
                 empty queue, or read-only source under Move mode. Both
                 disable the Start button alongside being shown. -->
            <div id="copy-modal-source-empty" class="text-error mt-2 hidden text-body-sm font-bold">
                Queue is empty — nothing to copy or move.
            </div>
            <div id="copy-modal-source-readonly" class="text-error mt-2 hidden text-body-sm font-bold">
                Move requires consume permission on this queue. Switch to Copy mode to proceed.
            </div>
            <div id="copy-modal-source-noaccess" class="text-error mt-2 hidden text-body-sm font-bold">
                You don't have access to this queue. Both Copy and Move are blocked — connect as the queue owner or as a user with at least Read-Only others-permission.
            </div>
        </div>

        <!-- Run phase -->
        <div id="copy-modal-run" class="copy-modal-section hidden">
            <div class="form-group">
                <label>Progress</label>
                <div class="copy-progress-bar">
                    <div id="copy-progress-fill" class="copy-progress-fill"></div>
                </div>
                <div id="copy-progress-text" class="text-secondary mt-2 text-body-sm">0 / 0</div>
            </div>
            <div id="copy-run-error" class="text-error mt-2 hidden text-body-sm"></div>
        </div>

        <div class="flex-row justify-between mt-4">
            <button id="copy-modal-cancel" class="btn btn-secondary">Cancel</button>
            <button id="copy-modal-start" class="btn btn-primary" disabled>Copy</button>
        </div>
    </div>
</dialog>
    </template>

    <template data-module-id="queue-subscription-explorer">
<!-- The SEMP-connection gate is created at install by createGate() (see module.ts). -->

<!-- About Card (placeholder explanation) -->
<div id="subexp-about" class="card hidden">
    <h2 class="card-title mb-4 text-secondary">About</h2>
    <p class="mb-4 text-secondary">
        This view lists every subscription that the queues on the broker carry,
        across all VPNs you can see.</p>
    <p class="mb-4 text-secondary">Use the column filters below the table
        header to narrow the list.</p>
    <p class="mb-4 text-secondary">VPN and Queue accept literal substrings or
        <code>*</code> wildcards.
    </p>
    <p class="mb-4 text-secondary">Subscription accepts Solace topic wildcard
        (<code>*</code> for one level, <code>&gt;</code> for trailing levels)
        and matches by topic-set intersection. For easier searches, <code>*</code>
        in the middle of the topic is treated as a wildcard too.
    </p>
    <p class="text-secondary">To start, click on "Load"</p>
</div>

<!-- Search & Results Card -->
<div id="subexp-table-card" class="card subexp-card hidden">
    <div class="subexp-card-head flex-row items-center justify-between mb-3">
        <div class="flex-row items-end gap-2">
            <h2 class="card-title">Queue Subscriptions Search</h2>
            <span id="subexp-counter" class="subexp-counter"></span>
        </div>
        <button id="btn-subexp-load" class="btn btn-secondary">Load</button>
    </div>
    <div class="subexp-table-wrap">
        <table class="subexp-table">
            <colgroup>
                <col class="subexp-col-vpn">
                <col class="subexp-col-queue">
                <col class="subexp-col-sub">
            </colgroup>
            <thead>
                <tr class="subexp-header-row">
                    <th>VPN</th>
                    <th>Queue</th>
                    <th>Subscription</th>
                </tr>
                <tr class="subexp-filter-row">
                    <th><input id="subexp-filter-vpn" type="text" class="form-control" placeholder="Filter VPN…"
                            autocomplete="off"></th>
                    <th><input id="subexp-filter-queue" type="text" class="form-control" placeholder="Filter queue…"
                            autocomplete="off"></th>
                    <th><input id="subexp-filter-sub" type="text" class="form-control"
                            placeholder="Filter subscription (topic syntax)…" autocomplete="off"></th>
                </tr>
            </thead>
            <tbody id="subexp-tbody">
                <tr class="subexp-empty-row">
                    <td colspan="3" id="subexp-empty">Click <strong>Load</strong> to fetch subscriptions from the
                        broker.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
    </template>

    <!-- Vite Entry Point -->
</body>

</html>
