    <!-- Desktop-only gate. Toggles `html.mobile-blocked` based on viewport width.
         Threshold matches the layout's minimum usable width — below it, the overlay
         covers the app. Re-checks on resize so a desktop user shrinking their window
         (or a mobile user rotating) sees the gate appear/disappear without reload. -->
    <script>
        (function () {
            var MIN_DESKTOP_WIDTH = 800;
            function check() {
                var blocked = window.innerWidth < MIN_DESKTOP_WIDTH;
                document.documentElement.classList.toggle('mobile-blocked', blocked);
                if (blocked) {
                    var vp = document.getElementById('desktop-only-viewport');
                    if (vp) vp.textContent = window.innerWidth + ' × ' + window.innerHeight + ' px';
                }
            }
            check();
            window.addEventListener('resize', check);
        })();
    </script>

<body class="dark-theme">
    <!-- Desktop-only overlay. Covers the app when `html.mobile-blocked` is set by
         the inline gate script in <head>. The app-container below continues to
         initialise; resizing the viewport to >= 800px reveals it without reload. -->
    <div id="desktop-only-overlay" class="desktop-only-overlay" role="alert">
        <div class="desktop-only-message">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <h2>Desktop Only</h2>
            <p>This application is designed for desktop browsers. Please open it on a
                computer with a browser window of at least <strong>800 px</strong> wide.</p>
            <p class="desktop-only-viewport-line">
                Current viewport: <span id="desktop-only-viewport">—</span>
            </p>
        </div>
    </div>

    <div id="missing-lib-banner" class="notification-banner is-pending">Loading the Solace library...</div>

        <div class="card about-card">
            <h2 class="about-title">Solace Message Utility</h2>
            <p>Solace Message Utility is a browser-based tool for people who work with Solace PubSub+ event brokers: developers, testers and support teams who need to look at the messages on a queue, and the administrators who decide who may do that.</p>
            <p>Browse a queue and read each message's properties and payload, forward or delete messages, copy messages from one queue to another, on the same broker or a different one, and search the topic subscriptions of your queues. The app is one self-contained page that runs in your browser: there is nothing to install on your machine.</p>

            </dl>
        </div>
    </div>

                <article class="manual-chapter">
    <h2>Connections</h2>
    <p class="manual-lead">Connect the app to your Solace broker. The Connections page holds the two connections every other page relies on: the Solace client connection, which carries messages, and the SEMP connection, which reads the broker's management data.</p>
    <p>Nothing else needs to be set up first. You need the address of a broker, a Message VPN on it, and an account for each connection. The other pages show <strong>Connection Required</strong> until the connection they need is up. A gateway in Provisioned mode adds a <strong>Provisioned</strong> tab to this page. The manual of that gateway's app describes it in its Provisioned connections chapter.</p>

    <h3>Finding your way around</h3>
    <p>Every page of the app sits inside the same frame. Learn the frame once and it looks the same everywhere.</p>

    <ol class="manual-callouts">
        <li>The bell, with the number of unread notifications. Click it to open the drawer. Opening it marks everything as read.</li>
        <li><strong>Clear all</strong> empties the list. <strong>Close</strong> closes the drawer, as do the <kbd>Esc</kbd> key and a click outside it.</li>
        <li>One notification: the time, the level (<code>info</code>, <code>ok</code>, <code>warn</code> or <code>error</code>), the page it concerns, and the text.</li>
    </ol>
    <ul>
        <li>The drawer records every toast that is a success, a warning or an error. It also records each connection event: <code>Connected to broker "&lt;host&gt;", VPN "&lt;vpn&gt;".</code>, <code>Disconnected from broker "&lt;host&gt;", VPN "&lt;vpn&gt;".</code>, <code>SEMP connected to "&lt;host&gt;".</code> and <code>SEMP disconnected.</code></li>
        <li>An empty drawer reads <code>No notifications yet.</code> The drawer keeps the latest 200.</li>
        <li>The list belongs to the browser tab. It survives a reload and goes when you close the tab. Connecting to a different broker host than the last connection clears it.</li>
    </ul>

        <li>The settings button beside the card's title, which opens Advanced Connection Settings.</li>
        <li>The sign-in scheme: <strong>Basic</strong> or <strong>OAuth2</strong>.</li>
        <li>The Messaging address on one row: <strong>Protocol</strong>, <strong>Messaging Host (IP or Hostname)</strong> and <strong>Port</strong>. The Messaging Host is locked for a software or cloud broker, where it shows the Broker Host.</li>
        <li>The <strong>Message VPN</strong>, and the Messaging <strong>Username</strong> and <strong>Password</strong>.</li>
        <li>The Messaging <strong>Connect</strong> button.</li>
        <li><strong>Reset Form</strong>, <strong>Load All Config</strong> and <strong>Save All Config</strong>.</li>
    </ol>
    <p>The two connections are independent. You can make either one, or both, in either order. Press the <kbd>Enter</kbd> key in a text box of a card to press that card's <strong>Connect</strong> button. The Broker Host belongs to the SEMP card, and the Messaging Host to the Messaging card.</p>

    <h3>One host or two: the broker type</h3>
    <p>A software or cloud broker answers SEMP and messaging on one host. A Solace appliance answers SEMP on its management address and messaging on another. The <strong>Solace Event Broker Type</strong> card at the top of the page says which of the two you have.</p>
    <table>
        <thead>
            <tr><th>Type</th><th>The host boxes</th></tr>
        </thead>
        <tbody>
            <tr><td><strong>Software / Cloud</strong></td><td>One host. Type it into <strong>Broker Host (IP or Hostname)</strong>, in the SEMP card. The <strong>Messaging Host (IP or Hostname)</strong> box of the Messaging card is locked and shows the same host. The page opens with this choice, and the card reads <code>One host serves both management and messaging.</code></td></tr>
            <tr><td><strong>Appliance</strong></td><td>Two hosts. The box of the SEMP card is labelled <strong>Management Host (IP or Hostname)</strong>. The box of the Messaging card is free: it starts with the host already typed, for you to replace with the appliance's messaging address. The card reads <code>Management and messaging each take their own host.</code></td></tr>
        </tbody>
    </table>
    <ul>
        <li>The type cannot be changed while either connection is up.</li>
        <li>Changing back to <strong>Software / Cloud</strong> drops the messaging host you typed.</li>
        <li><strong>Appliance</strong> with the same host in both boxes stays an appliance: it is saved, and loads again, as <strong>Appliance</strong>.</li>
    </ul>

    <h3>Connecting the Solace client</h3>
    <p>The Solace client connection opens a Web Messaging session (a WebSocket) to your broker. The Queue Browser chapter describes what it does with that session: read, forward and delete messages.</p>
    <ol class="manual-steps">
        <li>Give the host. For a software or cloud broker, fill in <strong>Broker Host (IP or Hostname)</strong> in the SEMP card. For an appliance, fill in <strong>Messaging Host (IP or Hostname)</strong> in the Messaging card.</li>
        <li>In the <strong>Solace Messaging (Client)</strong> card, choose the sign-in scheme and fill in the address, the <strong>Message VPN</strong>, and the account.</li>
        <li>Press <strong>Connect</strong>. The button reads <code>Connecting...</code> and stays off until the broker answers.</li>
        <li>When the session is up the button turns red and reads <strong>Disconnect</strong>, and the Client indicator turns green. Press <strong>Disconnect</strong> to end the session.</li>
    </ol>
    <p>While the Solace client is connected, every field of the card is locked, and so is the host it uses: the Broker Host of a software or cloud broker, the Messaging Host of an appliance. Disconnect to change them.</p>
    <table>
        <thead>
            <tr><th>Field</th><th>What to enter</th></tr>
        </thead>
        <tbody>
            <tr><td><strong>Broker Host (IP or Hostname)</strong>, or <strong>Messaging Host (IP or Hostname)</strong> for an appliance</td><td>A host name such as <code>broker.example.com</code>, or an IPv4 address. An IPv6 address is not accepted. A bad value turns the box red with <code>Invalid hostname or IP address.</code> The Broker Host starts as <code>localhost</code> when nothing has been saved.</td></tr>
            <tr><td><strong>Protocol</strong></td><td><code>wss://</code> (encrypted, the default) or <code>ws://</code>. The list also shows <code>http://</code> and <code>https://</code>, but they are greyed out and cannot be chosen. A page opened over <code>https://</code> without a gateway offers only <code>wss://</code>, because the browser blocks an unencrypted connection from it.</td></tr>
            <tr><td><strong>Port</strong></td><td>The broker's WebSocket port, a whole number from 1 to 65535. A bad value turns the box red with <code>Invalid port.</code></td></tr>
            <tr><td><strong>URL Path</strong></td><td>Optional. A path placed after the port, for a broker behind a reverse proxy. The row shows only a small <strong>+ URL path</strong> button, above the end of the row, until you press it. The box then joins the row after the port; the cross in the box empties it and hides it again. A leading <code>/</code> is added and a trailing one dropped. A path that is saved, loaded or typed always shows its box.</td></tr>
            <tr><td><strong>Message VPN</strong></td><td>The Message VPN to join, for example <code>default</code>. It cannot be blank: <code>Message VPN is required.</code></td></tr>
            <tr><td><strong>Username</strong></td><td>The client username: up to 189 printable ASCII characters, without <code>?</code> or <code>*</code>. Letter case counts. A blank value turns the box red with <code>Field is required.</code> A refused value turns it red too, and an error line under the card says why.</td></tr>
            <tr><td><strong>Password</strong></td><td>The client password. The page does not check it, and it is never saved.</td></tr>
        </tbody>
    </table>

    <h4>Basic and OAuth2</h4>
    <p>The two joined buttons at the top right of the card pick how you sign in to the broker. The pressed one is the choice.</p>
    <ul>
        <li><strong>Basic</strong> signs in with a username and a password. This is the default.</li>
        <li><strong>OAuth2</strong> signs in with tokens. The first box is then labelled <strong>Access Token</strong> and the second <strong>ID Token</strong>. The rule for client usernames does not apply to a token.</li>
    </ul>

    <h4>When Connect fails</h4>
    <p>A red line under the Connect button says what went wrong. Look for these.</p>
    <table>
        <thead>
            <tr><th>The line says</th><th>What to do</th></tr>
        </thead>
        <tbody>
            <tr><td>A highlighted box and a short reason, with nothing sent</td><td>The form did not pass its checks. Correct the box that is red.</td></tr>
            <tr><td><code>Connection Failed:</code> followed by the broker library's own text</td><td>The broker or the network refused the session. When the text includes <code>Connection error</code> and no gateway serves the page, a <strong>Trust Certificate?</strong> link appears. See the helper for a certificate below.</td></tr>
            <tr><td><code>Solace API not loaded.</code></td><td>The page could not find <code>solclient.js</code>. See Startup messages below.</td></tr>
            <tr><td>A line that begins <code>Solace Web Messaging SDK is below the required version (10.18.3)</code></td><td>The <code>solclient.js</code> beside the page is too old. Use version 10.18.3 or newer.</td></tr>
        </tbody>
    </table>

    <h3>Connecting SEMP</h3>
    <p>SEMP is the broker's management interface. The page connects to its SEMP v2 REST API and uses it to read facts about the broker, such as which queues exist. The pages that list a broker's queues and subscriptions need it. A SEMP connection is not a standing session: the page checks your account with one request, and then sends each later request with the same account.</p>
    <ol class="manual-steps">
        <li>Fill in <strong>Broker Host (IP or Hostname)</strong>, in the first row of the card. For an appliance the box is labelled <strong>Management Host (IP or Hostname)</strong> and takes its management address.</li>
        <li>In the <strong>Solace SEMP (Management)</strong> card, fill in the address and the account.</li>
        <li>Press <strong>Connect</strong>. The button reads <code>Connecting...</code> while the page waits.</li>
        <li>When the broker accepts the account the button turns red and reads <strong>Disconnect</strong>, and the SEMP indicator turns green.</li>
    </ol>
    <p>The fields lock while SEMP is connected. The Broker Host of a software or cloud broker stays locked while either connection is up. An appliance's Management Host is locked by the SEMP connection alone.</p>
    <table>
        <thead>
            <tr><th>Field</th><th>What to enter</th></tr>
        </thead>
        <tbody>
            <tr><td><strong>Protocol</strong></td><td><code>https://</code> (the default) or <code>http://</code>. A page opened over <code>https://</code> without a gateway offers only <code>https://</code>.</td></tr>
            <tr><td><strong>Port</strong></td><td>The broker's SEMP port, a whole number from 1 to 65535.</td></tr>
            <tr><td><strong>URL Path</strong></td><td>Optional, and hidden until you press the small <strong>+ URL path</strong> button, as in the Messaging card. The path goes after the port and before the SEMP address, for a broker behind a reverse proxy.</td></tr>
            <tr><td><strong>Username</strong></td><td>The SEMP account name: 1 to 32 characters from A-Z, a-z, 0-9, underscore and hyphen. Without one the page says <code>SEMP username is required.</code> (the box says <code>Username is required.</code>).</td></tr>
            <tr><td><strong>Password</strong></td><td>The account's password: 1 to 128 printable ASCII characters, no spaces, and none of these: colon, parentheses, double quote, semicolon, apostrophe, less-than and greater-than signs, comma, backtick, backslash, asterisk, ampersand, vertical bar. The page refuses anything else before it sends a request, and says why under the card.</td></tr>
        </tbody>
    </table>

    <h4>When SEMP Connect fails</h4>
    <table>
        <thead>
            <tr><th>The line says</th><th>What it means</th></tr>
        </thead>
        <tbody>
            <tr><td><code>Authentication Failed (401). Check username/password.</code></td><td>The broker refused the account.</td></tr>
            <tr><td><code>SEMP Network Error:</code> followed by a reason</td><td>The request failed, or the broker answered with an error such as <code>403 Forbidden</code>. When the browser could not reach the broker at all, a <strong>Trust Certificate?</strong> link appears.</td></tr>
            <tr><td><code>SEMP Network Error: Connection timed out (15s). Check host and port.</code></td><td>The broker did not answer within 15 seconds.</td></tr>
        </tbody>
    </table>
    <p>If the broker later refuses your SEMP account in the middle of your work, the page drops the SEMP connection: the button returns to <strong>Connect</strong> and the SEMP indicator turns red. Connect again with the right account.</p>
    <aside class="manual-note" data-kind="important">
        <p>From a browser, SEMP is a web request to your broker. The broker must allow it through CORS. When a gateway serves the app, the gateway makes the request and CORS does not come into it.</p>
    </aside>

    <h3>Advanced Settings</h3>
    <p>Press the settings button beside the title of the Messaging card to open <strong>Advanced Connection Settings</strong>. The settings control the Solace client connection only. Close the dialog with <strong>Close</strong>, the <kbd>Esc</kbd> key or a click outside it.</p>

    <p>The page does not check the first four numbers itself. Keep to the lowest values the boxes mark.</p>
    <h4>Max Messages per Queue</h4>
    <p>When a queue holds more messages than the limit, the oldest are dropped from the page as newer ones arrive. A higher limit keeps more history and uses more of the browser's memory. The Queue Browser chapter explains the second limit, a size limit of 32 MiB for each queue.</p>
    <p>The value is checked as you type, and a message appears under the box: <code>Must be a whole number.</code>, <code>Must be at least 1.</code> or <code>Must not exceed 10000.</code> The value you see when you press <strong>Connect</strong> is the one the session uses. You do not need to save it first. If the box holds an invalid value at that moment, the connect goes ahead with 100.</p>
    <h4>Client Name Identifier</h4>
    <p>The broker lists each session by a client name. The page builds it as <code>SolMsgUtil/YYYYMMDDHHMMSS/&lt;identifier&gt;</code>, with the time you pressed <strong>Connect</strong> in the middle, so every session can be told apart in the broker's tools. The box fills itself with a generated identifier when you have none saved.</p>
    <ul>
        <li>When you leave the box, spaces at either end are removed. A blank box is filled with a fresh generated identifier.</li>
        <li>A value with other characters is refused with <code>Allowed: letters, digits, and !@#$%^&amp;*-=_+/.,</code>. A value that is too long is refused with <code>Must not exceed 100 characters.</code></li>
        <li>An invalid identifier stops <strong>Connect</strong> and <strong>Save All Config</strong>. The message shows inside this dialog, so open it to read the reason.</li>
    </ul>
    <p>While the Solace client is connected, you can still open the dialog to see the values the session uses, but you cannot change them.</p>

    <h3>Saving and loading your settings</h3>
    <p>The three buttons at the foot of the page keep your connection details between visits. The page keeps one saved set of settings in your browser. It has no list of named profiles.</p>
    <table>
        <thead>
            <tr><th>Button</th><th>What it does</th></tr>
        </thead>
        <tbody>
            <tr><td><strong>Save All Config</strong></td><td>Saves what the form shows, replacing the earlier set. A toast reads <code>Configuration saved</code>. If the browser cannot store it, an error toast says that storage is unavailable. An invalid Max Messages per Queue or Client Name Identifier stops the save without a toast; open Advanced Settings to read the message.</td></tr>
            <tr><td><strong>Load All Config</strong></td><td>Puts the saved set into the form and shows <code>Configuration loaded</code>. With nothing saved, nothing happens. The saved set is also loaded by itself each time you open the page.</td></tr>
            <tr><td><strong>Reset Form</strong></td><td>Empties the form: the host, ports, paths, Message VPN, usernames and passwords. It sets the broker type to <strong>Software / Cloud</strong>, both protocols to <code>wss://</code> and <code>https://</code>, sign-in to <strong>Basic</strong>, and the Client Name Identifier to a fresh one. The five numbers in Advanced Settings stay as they are, and so do the saved set and any live connection. A toast reads <code>Form reset</code>.</td></tr>
        </tbody>
    </table>
    <h4>What is stored, and what is not</h4>
    <ul>
        <li>Stored: the Broker Host, and an appliance's Messaging Host, which also tells the page the broker type; for each connection the protocol, port, URL path and username; the Message VPN; the sign-in scheme; the five numbers of Advanced Settings; and the Client Name Identifier.</li>
        <li>Not stored: both passwords. Type them again after a load.</li>
        <li>In OAuth2 mode the first box holds the access token. It is stored like the Messaging username, so an access token is saved with the rest.</li>
    </ul>
    <aside class="manual-note" data-kind="warning">
        <p>The saved set is disguised, not encrypted. Anyone who can use your browser profile can read it. There is no button that deletes the saved set: to remove it, clear the site data of this page in your browser. Do not save an access token on a shared computer.</p>
    </aside>
    <p>The saved set belongs to the address the page is opened from. The same page opened from another address starts with no saved set.</p>
    <p>A saved <code>ws://</code> or <code>http://</code> cannot be used by a page opened over <code>https://</code> without a gateway. It loads as <code>wss://</code> or <code>https://</code>, and a warning toast tells you so, for example <code>ws:// is now wss://</code>. The port may still be the unencrypted one, so check it.</p>

    <h3>The helper for a certificate the browser does not trust</h3>
    <p>A browser refuses a connection to a broker whose certificate it does not trust, for example one the broker signed itself. The page cannot tell you that in so many words, so a red error line offers a <strong>Trust Certificate?</strong> link, followed by <code>(or CORS)</code>. Press it to open the <strong>Certificate Trust Helper</strong>. Close it with the cross at its top right, the <kbd>Esc</kbd> key or a click outside it.</p>

    <p>When a gateway serves the app, a Messaging connect error does not offer the link, because your browser does not open the connection to the broker itself. A SEMP connect error that is a network failure still offers it.</p>

    <h3>Startup messages</h3>
    <h4>The Solace library banner</h4>
    <p>The app needs the Solace library, <code>solclient.js</code>, to open the client connection. The banner above the app tells you how the library is doing.</p>
    <table>
        <thead>
            <tr><th>The banner says</th><th>What it means</th></tr>
        </thead>
        <tbody>
            <tr><td><code>Loading the Solace library...</code></td><td>The library is being fetched. The banner goes when it has loaded. A <strong>Connect</strong> pressed meanwhile waits for it, for up to 30 seconds.</td></tr>
            <tr><td><strong>solclient.js</strong> not found. Please place it in the same directory.</td><td>The file is missing, or it loaded but did not define the library. Put <code>solclient.js</code> next to the page, or in a <code>js</code> folder beside it.</td></tr>
            <tr><td><strong>Outdated Library</strong>: Found Solclient and a version, required 10.18.3+. Connecting is disabled.</td><td>The library is older than the app accepts. Replace it with version 10.18.3 or newer.</td></tr>
            <tr><td>The Solace library did not finish loading. Check that solclient.js is next to this page.</td><td>Nothing settled within 30 seconds. A late result still replaces this message.</td></tr>
        </tbody>
    </table>
    <p>Where to get the file is in <a href="https://github.com/SolaceLabs/solace-msg-utility/blob/main/docs/deployment.md#vendor-libraries">the deployment guide</a>.</p>

    <h4>Other messages when the app starts</h4>
    <ul>
        <li><code>Loading...</code> fills the page area until the first page is ready. If no page can start it reads <code>No modules are available. Check the browser console.</code></li>
        <li>If one page fails to start, an error toast reads <code>Module "&lt;name&gt;" failed to install. See the browser console for details.</code> The other pages still work.</li>
        <li>The page asks once whether a gateway serves it. If the answer does not arrive, a box at the top of the Connections page reads <code>Could not check whether this page is served by the gateway.</code> and has a <strong>Retry</strong> button, which reloads the page. The form stays usable meanwhile, as for a page with no gateway. A plain "no gateway" answer shows no box.</li>
    </ul>

    <h3>When a gateway serves the app</h3>
    <p>A gateway is a server that hosts this app and makes the connections to your broker for you. You use the form in the same way. What changes is who reaches the broker.</p>
    <table>
        <thead>
            <tr><th>Topic</th><th>Without a gateway</th><th>With a gateway</th></tr>
        </thead>
        <tbody>
            <tr><td>Who connects to the broker</td><td>Your browser.</td><td>The gateway. The broker need not be reachable from your browser.</td></tr>
            <tr><td>What you type</td><td>The broker's protocol, host, port and path.</td><td>The same values. The page shows the same fields.</td></tr>
            <tr><td>Plain <code>ws://</code> and <code>http://</code></td><td>Offered only when the page itself is not opened over <code>https://</code>.</td><td>Always offered.</td></tr>
            <tr><td>CORS</td><td>The broker must allow this page's origin for SEMP.</td><td>Not needed.</td></tr>
            <tr><td>Certificate Trust Helper, for a Messaging error</td><td>Offered by the <strong>Trust Certificate?</strong> link.</td><td>Not offered.</td></tr>
        </tbody>
    </table>
    <p>Everything else on this page is the same: the fields and their checks, Advanced Settings, and saving and loading. The deployment guide describes <a href="https://github.com/SolaceLabs/solace-msg-utility/blob/main/docs/deployment.md#gateway-mode">Gateway mode</a>.</p>

    <h3>Showing more detail in the browser console</h3>
    <p>When something goes wrong, the app writes what it did to the browser's developer tools console. Add <code>logLevel</code> to the address of the page to choose how much it writes, for example <code>index.html?logLevel=DEBUG</code>.</p>
    <table>
        <thead>
            <tr><th>Value</th><th>What you see</th></tr>
        </thead>
        <tbody>
            <tr><td><code>DEBUG</code></td><td>Everything, with fine-grained detail of each step.</td></tr>
            <tr><td><code>INFO</code></td><td>The default: the main events, warnings and errors.</td></tr>
            <tr><td><code>WARN</code></td><td>Warnings and errors.</td></tr>
            <tr><td><code>ERROR</code></td><td>Errors only.</td></tr>
            <tr><td><code>SILENT</code></td><td>Nothing.</td></tr>
        </tbody>
    </table>
    <p>The value can be in any letter case. A value the app does not know is ignored, and the default applies.</p>
</article>

    <h3>Binding to a queue</h3>
    <ol class="manual-steps">
        <li>Type the name of the queue in <strong>Queue Name</strong>.</li>
        <li>Press <strong>Bind</strong>, or press <kbd>Enter</kbd>.</li>
        <li>A message confirms <code>Queue "&lt;name&gt;" bound</code>. The queue appears in <strong>Bound Queues</strong>, and its messages start to arrive in the table.</li>
    </ol>
    <p>You can bind up to <strong>3 queues at once</strong>. Switch between them in <strong>Bound Queues</strong>; each queue keeps its own messages. To stop receiving messages from a queue, select it and press <strong>Unbind</strong>. <strong>Unbind</strong> also discards the messages the page had read from that queue; bind it again to read them afresh.</p>
    <aside class="manual-note">
        <p>The table is a snapshot. Another application may have consumed a message since you bound the queue, so a message you see here may no longer be on the broker.</p>
        <p>The page keeps the latest messages of each queue: as many as <strong>Max Messages per Queue</strong> allows (in Advanced Settings on the Connections page), and never more than 32 MiB. The oldest messages go first, at whichever limit is reached first.</p>
    </aside>
    <h4>When the broker ends a binding</h4>
    <p>The broker can end a binding for good: the queue is deleted or its egress is disabled, your permissions change, or an administrator unbinds the client. A message then says <code>Queue "&lt;name&gt;" was disconnected: &lt;reason&gt;. Bind it again to continue.</code> The queue leaves <strong>Bound Queues</strong> and frees its place. If it was on show, the page moves to the next bound queue. Bind it again once the cause is fixed.</p>

    <h3>The message table</h3>
    <table>
        <thead>
            <tr><th>Column</th><th>What it holds</th></tr>
        </thead>
        <tbody>
            <tr><td>Tick box</td><td>Ticks the message for the bulk buttons. The box in the header ticks or clears every message on show.</td></tr>
            <tr><td>Message ID</td><td>The Guaranteed Message ID the broker gave the message.</td></tr>
            <tr><td>Date</td><td>The sender's timestamp, or <code>(No Timestamp)</code> when the sender set none.</td></tr>
            <tr><td>Size</td><td>The size of the message.</td></tr>
            <tr><td>Actions</td><td>The row buttons: Download Content, Download Full, Forward and Delete.</td></tr>
        </tbody>
    </table>
    <p>The bar above the table counts the messages: <strong>Total</strong> is every message the page holds for the queue, <strong>Displayed</strong> is how many of them pass the filter, and <strong>Selected</strong> is how many you have ticked.</p>

    <h3>Message details</h3>

    <ol class="manual-callouts">
        <li>The type of the message: Text, Binary, Map or Stream.</li>
        <li><strong>Show Raw Content</strong> opens the message as the Solace library dumps it: its header fields, then the bytes of the attachment in hex, sixteen to a line, with the printable ones beside them.</li>
        <li>The <strong>Message ID</strong>, the <strong>Destination</strong> (a topic or queue name, with a badge for which) and, when the broker provides one, the <strong>Replication Group Message ID</strong>. The small buttons copy the Destination and the Repl Grp Msg Id.</li>
        <li><strong>Message Properties</strong>: the standard Solace properties, such as Delivery Mode, TTL, Priority and Correlation ID.</li>
        <li><strong>Application / User Properties</strong>: the keys and values the publisher set.</li>
        <li><strong>Content Preview</strong>: the payload as text, with a button that copies it.</li>
    </ol>
    <h4>What Content Preview shows</h4>
    <table>
        <thead>
            <tr><th>The payload is</th><th>You see</th></tr>
        </thead>
        <tbody>
            <tr><td>Text, XML, or a binary attachment that holds UTF-8 text</td><td>The text.</td></tr>
            <tr><td>A map or a stream</td><td>Its fields as YAML: strings, numbers, true and false, <code>null</code>, nested maps and lists, bytes as <code>!!binary</code> followed by base64, and a destination as <code>{ topic: name }</code> or <code>{ queue: name }</code>. The copy button copies that YAML.</td></tr>
            <tr><td>Binary that is not text</td><td>What its first bytes say it is, and its size, for example <code>[Binary payload, looks like PNG image: 1,234 bytes]</code>. Other kinds include gzip-compressed data, a PDF document and an executable. When the bytes match no known kind you see only the size: <code>[Binary payload: 1,234 bytes]</code>. The copy button stays off.</td></tr>
            <tr><td>A PNG, JPEG, GIF or WebP image</td><td>The same line as any binary payload, and a <strong>Show content</strong> button beside the copy button. It puts the image in place of the box; <strong>Hide content</strong> puts the box back.</td></tr>
        </tbody>
    </table>
    <p>Nothing is decoded until you press <strong>Show content</strong>. An image whose header declares more than 40 megapixels, or no size at all, has no button, and a line under the box says why. The header can declare a size its bytes do not hold, so even a small file can be refused.</p>
    <aside class="manual-note" data-kind="important">
        <p>Nothing in a payload is ever opened or run. An SVG or HTML payload is only ever shown as text. To get the bytes, use <strong>Download Content</strong>; to see them in hex, use <strong>Show Raw Content</strong>.</p>
    </aside>

    <h3>Filtering messages</h3>
    <p>Press the filter button (4 in Figure 1) to open <strong>Filter Messages</strong>. A filter changes only what the table shows. Every message stays in memory, and <strong>Clear Filter</strong> brings them all back.</p>

    <ol class="manual-callouts">
        <li><strong>Search Criteria</strong>, a switch with an answer on either side. <strong>Match ANY (OR)</strong>, where it starts, shows a message that passes at least one of the rules you filled in. <strong>Match ALL (AND)</strong> shows only a message that passes every one.</li>
        <li><strong>Message ID</strong> and <strong>Message Type</strong> (Any, Text, Binary, Map or Stream).</li>
        <li><strong>Destination Name</strong> and its <strong>Type</strong> (Any, Topic or Queue).</li>
        <li><strong>Properties Filter</strong>. Press the small <strong>+ Add</strong> button beside the title for each property to test. The key is the name of a standard or an application property, in any letter case; the key box suggests the standard ones: App Msg Id, Cache Id, Corr Id, Delivery Count, Delivery Mode, HTTP Encoding, HTTP Type, Priority, Reply To, Sender Id, SeqNumber, TTL and TopicSeqNum.</li>
        <li><strong>Body Content</strong>: text the payload must contain, in any letter case. A binary payload that is not text never matches.</li>
        <li><strong>Search Time Range</strong>: the sender's timestamp must be at or after <strong>Newer than</strong>, and at or before <strong>Older than</strong>. Fill in either or both. A message without a timestamp is left out once either is set.</li>
        <li><strong>Apply Filter</strong> filters the table. <strong>Clear Filter</strong> removes every rule and shows all messages. <strong>Cancel</strong> closes the dialog and changes nothing.</li>
    </ol>
    <h4>Using the * wildcard</h4>
    <p><strong>Message ID</strong>, <strong>Destination Name</strong> and a property's value are compared whole, in any letter case: <code>orders/eu/new</code> finds only that destination. Put <code>*</code> wherever any run of characters may stand, spaces and symbols included:</p>
    <table>
        <thead>
            <tr><th>You type</th><th>It finds</th></tr>
        </thead>
        <tbody>
            <tr><td><code>orders/eu/*</code></td><td>Every destination that starts with <code>orders/eu/</code>.</td></tr>
            <tr><td><code>*/cancelled</code></td><td>Every destination that ends with <code>/cancelled</code>.</td></tr>
            <tr><td><code>*eu*</code></td><td>Every destination with <code>eu</code> anywhere in it.</td></tr>
        </tbody>
    </table>
    <p><strong>Body Content</strong> needs no wildcard: it always looks for your text anywhere in the payload.</p>
    <aside class="manual-note" data-kind="tip">
        <p>Every dialog in the app closes with <kbd>Esc</kbd> or a click outside its box.</p>
    </aside>

    <h3>Forwarding messages</h3>
    <p>Forwarding sends a copy of one or more messages to another destination. The original stays on its queue.</p>
    <ol class="manual-steps">
        <li>Tick the messages and press <strong>Forward</strong> above the table, or press the forward button on one row.</li>
        <li><strong>Forward Message</strong> opens and lists the messages to send.</li>
        <li>Choose a <strong>Destination Type</strong> and, where it applies, type a <strong>Destination Name</strong>:
            <ul>
                <li><strong>Topic</strong>: the copy goes to every subscriber of the topic.</li>
                <li><strong>Queue</strong>: the copy goes to the queue you name.</li>
                <li><strong>Original Destination</strong>: each message goes back to the destination it was first sent to. The name box is off, because each message carries its own.</li>
            </ul>
        </li>
        <li>Press <strong>Send</strong>.</li>
    </ol>

        <li>Where the copies go. Both boxes are locked while a send runs.</li>
        <li>How many messages are done, out of how many.</li>
        <li>The messages, each with a mark: a grey dot while it waits, a spinner while it is sent, a green tick once the broker has acknowledged it, and a red dot when it failed, with the reason under it.</li>

    <p>A message fails when the broker rejects it, when the client disconnects during the send, or when the broker does not acknowledge it within 30 seconds (<code>Timed out waiting for broker acknowledgement.</code>).</p>
    <p><strong>Resend failed messages</strong> sends only the failed ones again. A message with a green tick is never sent twice. You may change the destination before you resend, so a retry can go somewhere else.</p>
    <aside class="manual-note" data-kind="important">
        <p>A forwarded message is a new message, sent in <strong>persistent</strong> delivery mode so that the broker confirms it, even when the original was direct. It copies the properties of the original: application message ID, correlation ID, priority, TTL, reply-to, user properties and the rest.</p>
    </aside>
    <aside class="manual-note">
        <p>Closing Forward Message discards its list. If you open it again, the messages are queued afresh: an acknowledgement that arrives late for the earlier attempt does not show in the new list.</p>
    </aside>

    <h3>Deleting messages</h3>
    <aside class="manual-note" data-kind="warning">
        <p>A deleted message is removed from the queue on the broker. It cannot be brought back.</p>
    </aside>
    <p>You can delete only on a queue whose badge reads <strong>Read-Write</strong>. It reads so when the queue's permission for other clients is Consume, Modify-Topic or Delete, or when you own the queue. When the broker lets your client do no more than read, the badge reads <strong>Read-Only</strong> and the rows have no delete button.</p>
    <ul>
        <li><strong>One message</strong>: press the delete button on its row. A dialog asks <code>Delete message &lt;id&gt;?</code></li>
        <li><strong>Several messages</strong>: tick them and press <strong>Delete</strong> above the table. The dialog says how many.</li>
    </ul>
    <p><strong>Delete</strong> in the dialog sends the removal. <strong>Cancel</strong>, <kbd>Esc</kbd> or a click outside sends nothing.</p>
    <p>A message then reports <code>Removal requested for N message(s).</code> and those rows leave the table. The broker does not confirm a removal: a message it did not remove shows up again the next time you bind the queue. If a removal could not be requested, the message is red and adds <code>M could not be requested: &lt;reason&gt;</code>; those rows stay in the table.</p>

    <h3>Downloading messages</h3>
    <p>Each download comes as a row button, for one message, and as a button above the table, for every message you ticked.</p>
    <table>
        <thead>
            <tr><th>Button</th><th>What you get</th></tr>
        </thead>
        <tbody>
            <tr><td><strong>Download Content</strong></td><td>The payload only, byte for byte, in a file named <code>solace-message-{id}.{ext}</code>.</td></tr>
            <tr><td><strong>Download Full</strong></td><td>The whole message as JSON, with its properties, destination, timestamp and payload, in <code>solace-message-{id}-full.json</code> inside a ZIP archive.</td></tr>
        </tbody>
    </table>
    <h4>Download Content</h4>
    <p>The file holds exactly the bytes of the payload: a binary attachment as it is, a text or XML message as UTF-8 text, and a map or stream as its raw wire bytes. Those wire bytes are in Solace's own encoding, which only a Solace API reads back; for a readable copy of a map or stream, use Download Full.</p>
    <p>The extension follows the payload:</p>
    <ul>
        <li>A binary payload takes the extension of the kind its first bytes show (<code>.png</code>, <code>.jpg</code>, <code>.gz</code>, <code>.zip</code>, <code>.pdf</code>, <code>.mp4</code> and so on), or <code>.bin</code> when the kind is not recognised. An executable also gets <code>.bin</code>, never <code>.exe</code>.</li>
        <li>Text takes <code>.json</code>, <code>.xml</code>, <code>.csv</code>, <code>.yaml</code> or <code>.txt</code>: from the publisher's HTTP Content-Type when it names one of those, otherwise from what the text looks like. HTML and SVG are saved as <code>.txt</code>.</li>
        <li>A map or stream gets <code>.bin</code>.</li>
    </ul>
    <p>In Chrome and Edge the row button opens the browser's save dialog on that name, where you can change the name or the folder; Cancel saves nothing. Firefox and Safari save the file straight to your downloads. The button above the table puts each message into one ZIP archive under the same names.</p>
    <aside class="manual-note">
        <p>The file is always sent to the browser as plain data, so the browser never opens it.</p>
    </aside>
    <h4>Download Full</h4>
    <p>Each message becomes one JSON file of this shape:</p>
    <pre><code data-lang="json">{
  "messageProperties":     { ... standard Solace properties + destination + messageType ... },
  "applicationProperties": { ... user/custom properties ... },
  "payload":               "..."
}</code></pre>
    <p>A text payload is carried as text. A binary payload that is not text is carried as base64, with <code>"payloadEncoding": "base64"</code> beside <code>"payload"</code>. A map or stream is carried the same way, as its raw wire bytes, with <code>"payloadDecoded"</code> beside them: its fields as plain JSON (a map as an object, a stream as an array, bytes as <code>{ "base64": ... }</code>, a destination as <code>{ "topic": ... }</code>, and a 64-bit integer too large for JSON's numbers as text).</p>
    <aside class="manual-note" data-kind="important">
        <p>This JSON shape belongs to this tool and may change in a later release. If you build automation on it, pin the version of the tool.</p>
    </aside>
    <aside class="manual-note">
        <p>A ZIP archive needs the <code>jszip.min.js</code> file beside the app; the gateway image includes it. Without it the app still runs, and only the ZIP downloads are off. If an archive cannot be built, a red message says why. See <a href="https://github.com/SolaceLabs/solace-msg-utility/blob/main/docs/deployment.md#vendor-libraries">Vendor libraries</a> in the Deployment guide.</p>
    </aside>

    <h3>If your page shows no payloads</h3>
    <p>An administrator may give you a build of the app that never shows what a message holds. In that build the message table, the properties, Forward and Delete work as this chapter says, and these parts are absent: Content Preview, Show Raw Content, the two download buttons and the Body Content rule of the filter.</p>

    <h2>Queue Copy</h2>
    <p class="manual-lead">Copy the messages of a queue to another queue or to a topic, or move them, on the same broker or on another one. A copy leaves the source as it is. A move takes each message off the source once the destination has it.</p>
    <p>Queue Copy needs the <strong>client connection</strong> from the Connections page. Until you connect, the page shows <strong>Connection Required</strong> and asks you to establish a primary Solace connection before copying messages.</p>
    <p>The <strong>SEMP connection</strong> is not required, but it helps. With it, the magnifier buttons can list queues for you, and the check you make before a run reads the queue's figures from the broker. Without it, the check browses the queue to count its messages: that takes longer, and it cannot show the queue's quota or its largest allowed message.</p>

        <li>The <strong>Queue</strong> or <strong>Topic</strong> switch: what the messages go to.</li>
        <li>The name of the destination queue or topic. The magnifier button, when it is shown, picks a queue from a list.</li>
        <li><strong>Mode</strong>: a switch between <strong>Copy</strong> and <strong>Move</strong>.</li>
        <li><strong>Next</strong>: opens the Confirm Queue Copy dialog.</li>
    </ol>

    <h3>The source</h3>
    <p>The three source cards, <strong>Source Broker</strong>, <strong>Solace SEMP (Management)</strong> and <strong>Solace Messaging (Client)</strong>, are a mirror of the connection you made on the Connections page. <strong>Source Broker</strong> shows the broker type, and each of the other two cards shows the host it uses. Their boxes are locked. To change anything, press <strong>Edit in Connections</strong>. If you are signed in to a gateway, one card takes the place of the three: <strong>Source Connection</strong> shows the <strong>Broker</strong> and <strong>Message VPN</strong> of your connection, both locked, with the same <strong>Edit in Connections</strong> button. It has no address or password to show, because the gateway keeps them. The card is pictured under "The Destination Connection card".</p>
    <p>The only box you fill in on the source side is the queue.</p>
    <ol class="manual-steps">
        <li>Type the name of the source queue in <strong>Queue name</strong> under <strong>Source Queue</strong>. Spaces at either end are dropped.</li>
        <li>Or press the magnifier button beside the box to pick the queue from a list. The button is shown only while the SEMP connection is up. Its dialog is described under "Picking a queue".</li>
    </ol>
    <p>If the queue you pick is in another Message VPN than the one your client connection uses, the page hands over to the Connections page, which asks <strong>Current VPN is ... Switch to ...?</strong> and switches the connection to that VPN once you press <strong>Switch</strong>. You then come back to Queue Copy with the queue name filled in. If you decline the switch, you stay where you were.</p>

    <h3>Picking a queue</h3>
    <p>Both magnifier buttons open the same dialog. Its title is <strong>Pick source queue</strong> or <strong>Pick destination queue</strong>.</p>
    <table>
        <thead>
            <tr><th>Part</th><th>What it does</th></tr>
        </thead>
        <tbody>
            <tr><td><strong>Message VPN</strong></td><td>Type to narrow the list, or choose from it. The list opens on the Message VPN the page is using, when it can. A line under the boxes says how many VPNs have loaded.</td></tr>
            <tr><td><strong>Queue</strong></td><td>Locked until you choose a Message VPN. Then type to narrow the list (any part of the name, in any letter case), or choose from it.</td></tr>
            <tr><td>The two refresh buttons</td><td>Fetch the VPN list, or the queue list of the chosen VPN, again from the broker. The dialog remembers lists it has loaded, so opening it again is quick.</td></tr>
            <tr><td><strong>Confirm</strong></td><td>Switched on once you have chosen a queue. It fills the page with your choice.</td></tr>
            <tr><td><strong>Cancel</strong> and the close button</td><td>Close the dialog and change nothing.</td></tr>
        </tbody>
    </table>
    <p>In a signed-in session the lists hold only what you are entitled to see. The destination's list holds only the queues you may write to.</p>

    <h3>The destination connection</h3>
    <p>The destination is where the messages go. It can be the connection you already have, another Message VPN on the same broker, or another broker. What the page shows for it depends on how you connected.</p>

    <h4>The Copy to button</h4>
    <p>The <strong>Destination Broker</strong> card holds the <strong>Copy to</strong> button. It has three parts, and the pressed one is your choice. <strong>This VPN</strong> is pressed when the page opens. A line under the button says what the choice leaves you to fill in.</p>
    <table>
        <thead>
            <tr><th>Copy to</th><th>What it means</th></tr>
        </thead>
        <tbody>
            <tr><td><strong>This VPN</strong></td><td>The destination is your client connection itself. The destination boxes are filled in and locked, and there is nothing to connect.</td></tr>
            <tr><td><strong>Another VPN</strong></td><td>Another Message VPN on the same broker. The broker and SEMP boxes are filled in and locked, and the destination uses your SEMP connection. The Message VPN, username and password boxes are yours to fill in, and the Messaging card needs its own <strong>Connect</strong>.</td></tr>
            <tr><td><strong>Another broker</strong></td><td>Another broker. Every box is yours to fill in, and both cards need their own <strong>Connect</strong>.</td></tr>
        </tbody>
    </table>
    <p>Changing the choice closes any destination connection you opened and empties the destination password boxes, so you start from a clean slate. While the destination's messaging connection is being made, the button is locked, and its tooltip says <strong>Locked while the destination connects.</strong></p>
    <p>When the page is served over <code>https://</code> without the gateway, the Protocol lists on the destination cards offer only <code>https://</code> and <code>wss://</code>, as on the Connections page.</p>

    <h4>Typed details</h4>
    <p>If you connected on the Connections page by typing the broker's details, the destination has the cards below. Fill in the ones the table above says are yours.</p>

    <p>The broker type works as it does on the Connections page, whose chapter describes it under "One host or two: the broker type". For <strong>Software / Cloud</strong> you type one host, in <strong>Broker Host (IP or Hostname)</strong> on the SEMP card, and the Messaging card shows the same host, locked. For <strong>Appliance</strong> the SEMP card takes the <strong>Management Host (IP or Hostname)</strong> and the Messaging card the <strong>Messaging Host (IP or Hostname)</strong>.</p>
    <ol class="manual-steps">
        <li>Fill in the <strong>Solace Messaging (Client)</strong> card and press <strong>Connect</strong>. The status line reads <strong>Connecting...</strong>, then <strong>Connected</strong> followed by the Message VPN in brackets. The page cannot run a copy until this connection is up, unless the destination is your own client connection.</li>
        <li>If you want to pick the destination queue from a list, fill in the <strong>Solace SEMP (Management)</strong> card too and press <strong>Connect</strong>. The status line reads <strong>Connected</strong>. The destination's SEMP connection serves only the list. A copy does not need it.</li>
        <li>To close a connection, press <strong>Disconnect</strong> on its card. The boxes unlock again.</li>
    </ol>
    <p>Pressing <kbd>Enter</kbd> in a box presses the <strong>Connect</strong> button of its card. While a connection is up, the boxes of its card are locked, and so is the broker type. The hosts lock as they do on the Connections page: the one host of a software or cloud broker while either connection is up, and each host of an appliance with its own connection. So with an appliance's SEMP connected you can still correct its Messaging Host. A connection that closes unlocks only its own card.</p>
    <p>The page checks what you typed before it connects. A SEMP username or password the broker would refuse, or a client username with a character the broker does not allow, is refused with the reason on the card. If the broker rejects the details, the card says so in red: <strong>SEMP authentication failed (401).</strong>, <strong>SEMP error:</strong> followed by the reason, or <strong>Connection failed:</strong> followed by the reason.</p>

    <h4>The Destination Connection card</h4>
    <p>If you are signed in to a gateway, you type no addresses and no passwords. On the source side, one card, <strong>Source Connection</strong>, shows the connection you have. On the destination side, the broker type and both cards give way to one card, <strong>Destination Connection</strong>. The <strong>Copy to</strong> button stays.</p>

    <ol class="manual-callouts">
        <li><strong>Source Connection</strong>: the broker and Message VPN of the connection you made on the Connections page. Both lists are locked, and the line under them names the two.</li>
        <li><strong>Edit in Connections</strong>: takes you to the Connections page, where you change the connection.</li>
        <li>The <strong>Copy to</strong> button. Here <strong>Another VPN</strong> is pressed: another Message VPN on the same broker.</li>
        <li><strong>Broker</strong>: the brokers your account may use. Unless <strong>Another broker</strong> is pressed, it shows the source's broker and is locked, so only the Message VPN is yours to choose.</li>
        <li><strong>Message VPN</strong>: the Message VPNs your account may use on the chosen broker.</li>
        <li><strong>Connect</strong>, which reads <strong>Connecting...</strong> and is off while it works, and <strong>Disconnect</strong> once connected.</li>

    </ol>
    <ol class="manual-steps">
        <li>Choose a <strong>Broker</strong>, when <strong>Another broker</strong> is pressed, and a <strong>Message VPN</strong>.</li>
        <li>Press <strong>Connect</strong>. The gateway supplies the credentials. When the broker is not the source's, the card opens a SEMP connection for the destination as well as the messaging connection. When it is the source's, only the messaging connection is opened.</li>
        <li>Wait for the card to show the broker and VPN. The card is connected only when everything it needs is up.</li>
    </ol>
    <p>If the connect fails, the card shows one line for each part that failed, <strong>SEMP (management)</strong> or <strong>Messaging (client)</strong>, and says when a part came up and was closed again because the other failed. Each failure is also added in full to the notification bell. If the destination has no connection available to your account, the card says <strong>No connections are available for your account. Ask an administrator to grant access.</strong></p>
    <p>While <strong>This VPN</strong> is pressed, the card is replaced by a note saying that the destination is the source connection: nothing to connect. While a connect is running, the card's lists and the <strong>Copy to</strong> button are locked. If the destination on show changes before the connection comes up, for example because a refresh of your entitlements removes the Message VPN you chose, the late connection is dropped and the card says <strong>The destination changed while connecting. Connect again.</strong></p>
    <p>If your sign-in changes to or from a signed-in session while the page is open, any destination connection and the target you chose are dropped. The same happens to the destination queue you chose when a refresh of your entitlements removes the Message VPN of a connected destination: the <strong>Queue name</strong> box is emptied, so you cannot start a run against it.</p>
    <p>The card's connection is one unit: if its messaging connection drops, its SEMP connection is closed with it, and <strong>Disconnect</strong> closes both.</p>
    <aside class="manual-note" data-kind="important">
        <p>In a signed-in session you can copy only into queues you are entitled to operate on. A run into any other queue is refused before anything is read. Your entitlements cover queues only, so a <strong>Topic</strong> destination is not checked against them: the broker decides whether the connection may publish to the topic, and a topic delivers to every queue that subscribes to it. Outside a signed-in session the page checks neither.</p>
    </aside>

    <h3>The destination target</h3>
    <p>The <strong>Destination</strong> card says what the messages go to.</p>
    <ol class="manual-steps">
        <li>Use the switch at the top of the card to choose <strong>Queue</strong> or <strong>Topic</strong>. The box under it is labelled <strong>Queue name</strong> or <strong>Topic</strong> to match.</li>
        <li>Type the name. For a queue the magnifier button opens the picker. It is shown only when the page can list the queues of the destination: the SEMP connection is up for the same broker, or the destination's own SEMP connection is up for another one. A topic has no list, so the button is hidden.</li>
        <li>If you pick a queue from another Message VPN than the destination's, the destination's Message VPN box takes that VPN. If <strong>This VPN</strong> was pressed, the choice becomes <strong>Another VPN</strong>. You then connect to it as usual.</li>
    </ol>
    <p>The page checks the name as you type, with the rules the messaging library applies when it publishes. A name that breaks one is marked, the reason appears under the box, and <strong>Next</strong> stays off.</p>
    <table>
        <thead>
            <tr><th>Rule</th><th>The page says</th></tr>
        </thead>
        <tbody>
            <tr><td>At most 250 bytes for a topic, 241 for a queue (the library adds a prefix to a queue name).</td><td><code>Too long: at most N bytes.</code></td></tr>
            <tr><td>A <code>/</code> may not start or end the name, or follow another <code>/</code>.</td><td><code>Empty level at character N: a "/" cannot start or end the name, or follow another "/".</code></td></tr>
            <tr><td>A <code>*</code> may only end a level.</td><td><code>"*" at character N may only end a level.</code></td></tr>
            <tr><td>A name may not start with the library's reserved prefixes, <code>#P2P/QUE/</code> and <code>#P2P/QTMP/</code>.</td><td><code>"#P2P/QUE/" is a reserved prefix.</code> (or the same for the other prefix)</td></tr>
        </tbody>
    </table>

    <h3>Copy or Move</h3>
    <p><strong>Mode</strong> sits at the bottom of the <strong>Destination</strong> card: a switch with <strong>Copy</strong> on its left and <strong>Move</strong> on its right. The side in bold is the mode.</p>
    <table>
        <thead>
            <tr><th>Mode</th><th>What happens</th></tr>
        </thead>
        <tbody>
            <tr><td><strong>Copy</strong> (the default)</td><td>Every message is sent to the destination. The source keeps all of them. It needs only permission to read the source queue.</td></tr>
            <tr><td><strong>Move</strong>, marked as destructive</td><td>Every message is sent to the destination, and as soon as the destination has acknowledged it, the page asks the broker to remove it from the source. It needs permission to consume from the source queue.</td></tr>
        </tbody>
    </table>

    <h3>Starting</h3>
    <p><strong>Next</strong> opens the Confirm Queue Copy dialog. It stays off until all of these hold:</p>
    <ul>
        <li>the source queue has a name;</li>
        <li>the destination has a name that passes the rules above;</li>
        <li>the destination is ready: <strong>This VPN</strong> is pressed, or the destination's Messaging connection is up.</li>
    </ul>
    <p>If you disconnect the client connection, the page returns to <strong>Connection Required</strong>.</p>

    <h3>The Confirm Queue Copy dialog</h3>
    <p>Before anything moves, the dialog checks the source queue and shows what it found. You read the figures, then start the run, or cancel.</p>

    <h4>The Source block</h4>
    <table>
        <thead>
            <tr><th>Field</th><th>Shows</th></tr>
        </thead>
        <tbody>
            <tr><td><strong>Broker</strong></td><td>The broker you are connected to, as address and port. In a signed-in session, its name.</td></tr>
            <tr><td><strong>Message VPN</strong></td><td>The Message VPN of the queue. When the broker reports it, that is the value shown.</td></tr>
            <tr><td><strong>Queue</strong></td><td>The name you gave.</td></tr>
            <tr><td><strong>Queue Usage</strong></td><td>The space the messages use, and, when the broker reports it, the queue's quota, as <code>used / quota</code>. Without a quota, the space alone. <code>(unavailable)</code> when neither is known.</td></tr>
            <tr><td><strong>Message Count</strong></td><td>How many messages the queue holds. This is the number the run works to.</td></tr>
            <tr><td><strong>Max Message Size</strong></td><td>The largest message the queue accepts. This row is left out when the page had to browse the queue because SEMP is not connected.</td></tr>
            <tr><td><strong>Oldest Msg ID</strong> and <strong>Newest Msg ID</strong></td><td>The first and last messages the run will handle. The run reads the queue once, from the oldest to the newest.</td></tr>
            <tr><td><strong>Status</strong></td><td><strong>Checking...</strong> while it works, then <strong>Found via SEMP</strong>, <strong>Found via QueueBrowser</strong> or <strong>Not Found</strong>.</td></tr>
        </tbody>
    </table>
    <p>The <strong>Destination</strong> block repeats where the messages will go: <strong>Broker</strong>, <strong>Message VPN</strong>, <strong>Type</strong> (<strong>Queue</strong> or <strong>Topic</strong>) and <strong>Name</strong> (or <strong>Topic</strong>). A value the form does not yet hold reads <code>(not set)</code>.</p>

    <h4>How the check works</h4>
    <ul>
        <li>With the SEMP connection up, the page asks the broker for the queue's figures. A second request fetches the newest message's number. If that one fails, the check still succeeds and the failure is shown in red. The run then has no newest message to stop at, and it ends when the queue has sent nothing for 30 seconds.</li>
        <li>Without SEMP, the page binds a temporary browser to the queue and counts what arrives. <strong>Message Count</strong> and <strong>Queue Usage</strong> show a running total marked <code>(loading...)</code>. The bind must answer within 10 seconds, or the check fails with <strong>Verification timed out after 10s.</strong> Once bound, counting ends when no message has arrived for 2 seconds.</li>
        <li><strong>Refresh</strong> repeats the check and replaces the figures. It is off while a check is running and is hidden once a run starts. If the queue is still being fed, a count taken without SEMP may never settle: press <strong>Cancel</strong>.</li>
    </ul>

    <h4>What the check refuses</h4>
    <p>When the check finds a problem, the start button stays off.</p>
    <table>
        <thead>
            <tr><th>You see</th><th>Why</th><th>What to do</th></tr>
        </thead>
        <tbody>
            <tr><td><strong>Not Found</strong> and a red message such as <code>Source queue "orders.incoming" not found in VPN "default".</code></td><td>No such queue, or the broker refused the request. The message gives the broker's reason.</td><td>Cancel, correct the queue name, and press <strong>Next</strong> again.</td></tr>
            <tr><td><code>You are not entitled to queue "orders.incoming".</code></td><td>A signed-in session: the queue is not one your account may see.</td><td>Choose another queue.</td></tr>
            <tr><td><code>No primary Solace session -- reconnect and retry.</code></td><td>The client connection dropped.</td><td>Connect again on the Connections page.</td></tr>
            <tr><td>A red banner: <strong>Queue is empty</strong>, nothing to copy or move</td><td>The queue holds no message, so there is nothing to copy or move.</td><td>Cancel, or press <strong>Refresh</strong> once messages have arrived.</td></tr>
            <tr><td>A red banner: <strong>Move requires consume permission on this queue</strong></td><td>You chose <strong>Move</strong>, and you may read the queue but not consume from it. In a signed-in session the same banner appears when your account may not operate on the queue.</td><td>Cancel, choose <strong>Copy</strong> and press <strong>Next</strong> again.</td></tr>
            <tr><td>A red banner: <strong>You don't have access to this queue</strong></td><td>You are not the queue's owner and its permission for others is No-Access. Both <strong>Copy</strong> and <strong>Move</strong> are blocked.</td><td>Connect as the owner, or as a user with at least read-only permission, then press <strong>Refresh</strong>.</td></tr>
        </tbody>
    </table>
    <p>The owner of a queue always has full access. When the queue's owner is the username of your client connection, the dialog treats the queue as read and write, whatever its permission for others says. The match is exact, letter case included. Without SEMP the page cannot read the owner, but the broker's answer to the temporary browser already counts ownership.</p>
    <p>With SEMP connected, the dialog reads the queue's permission for other users (No-Access, Read-Only, Consume, Modify-Topic or Delete) through SEMP. Without SEMP, it takes it from the broker's answer when the temporary browser binds. If neither gives an answer, the dialog does not block the run and leaves the broker to refuse it.</p>

    <h3>Running a copy or a move</h3>

    </figure>
    <ol class="manual-callouts">
        <li>The title: <strong>Copying...</strong> or <strong>Moving...</strong> while it runs, then <strong>Completed</strong>, <strong>Cancelled</strong> or <strong>Failed</strong>.</li>
        <li>The progress bar.</li>
        <li>The count: messages sent, out of the <strong>Message Count</strong> from the check.</li>
        <li>An error line, <strong>Error:</strong> followed by the reason. It appears only when the run fails or is refused.</li>
        <li><strong>Cancel copy</strong> or <strong>Cancel move</strong>. Once the run has ended it reads <strong>Close</strong>.</li>
    </ol>
    <p>The page sends the messages oldest first, and waits for the destination to acknowledge them. A message counts as sent only once its acknowledgement has arrived. A move asks the broker to remove each message from the source straight after its acknowledgement, not in a batch at the end.</p>
    <p>While the run is going, every control on the page is locked, so nothing can change under it. When the run ends, each control returns to the state it had before, and the dialog stays open until you press <strong>Close</strong>.</p>

    <h4>Stopping a run</h4>
    <p>Press <strong>Cancel copy</strong> or <strong>Cancel move</strong>, or press <kbd>Esc</kbd>. The page stops reading the queue and does not wait for acknowledgements still outstanding: a message not yet acknowledged when you cancel is not counted. The dialog stays open until the run has settled, then shows <strong>Cancelled</strong> with the number sent. The page notices the request when the next message arrives or a publish ends, so if the queue is sending nothing, the stop can take up to 30 seconds. In the check, <strong>Cancel</strong> and <kbd>Esc</kbd> stop the check and close the dialog.</p>
    <p>If your entitlements change during a run in a signed-in session, for example when you refresh them or sign out, and the change takes away your access to an endpoint of the run, the run stops in the same way and shows <strong>Cancelled</strong>.</p>

    <h4>How a run ends</h4>
    <table>
        <thead>
            <tr><th>Title</th><th>Meaning</th></tr>
        </thead>
        <tbody>
            <tr><td><strong>Completed</strong></td><td>The page reached the newest message, and every message of the check has been sent.</td></tr>
            <tr><td><strong>Cancelled</strong></td><td>You stopped it, or your entitlements changed. The count shows how many messages were sent.</td></tr>
            <tr><td><strong>Failed</strong></td><td>The run stopped on an error, and the <strong>Error:</strong> line says which.</td></tr>
        </tbody>
    </table>
    <p>The errors you may see:</p>
    <ul>
        <li><strong>First message ID did not match recorded oldest.</strong> The queue's contents changed between the check and the run. Check again and start again.</li>
        <li><strong>Recorded newest message was consumed before our run reached it.</strong> Someone else took messages from the source. The message gives the number sent and the number expected.</li>
        <li><strong>Message count mismatch.</strong> The run finished, but sent fewer messages than the check counted, because another consumer drained the source meanwhile.</li>
        <li>The broker's own reason for refusing a message, such as a full queue, a missing permission or a message that is too large for the destination. The run stops on the first one.</li>
        <li>A reason from the source, such as <strong>Browser disconnected</strong>, <strong>Browser connect failed</strong> or <strong>Could not open the source queue.</strong></li>
        <li><strong>Publisher unavailable</strong>, or <strong>The destination connection does not match the destination selected. Connect the destination again.</strong> The run is refused before it reads anything. This happens when the destination connection is not the one the form names, for example after you changed the target. The title still reads <strong>Copying...</strong> or <strong>Moving...</strong>: press <strong>Cancel copy</strong> or <strong>Cancel move</strong> to close the dialog, then connect the destination again.</li>
        <li>In a signed-in session, <strong>You are not entitled to write to queue</strong> followed by the queue's name. This too refuses the run before it reads anything.</li>
    </ul>

    <h3>Before you move messages</h3>
    <p>The <strong>Important Considerations</strong> card at the top of the page lists what to know before a run:</p>
    <ul>
        <li>Do not run it on a live queue that has publishers or consumers working on it.</li>
        <li>The whole run stops at the first error, for example a full destination or a missing permission.</li>
        <li>The page takes a snapshot of the source queue first, the count and the oldest and newest message of the check, so that the run has an end. Messages that arrive after the check are not part of the run.</li>
        <li>The destination needs enough spool quota.</li>
        <li>The destination needs a maximum message size at least as large as the source's.</li>
        <li>The destination needs ingress enabled.</li>
        <li>The source queue needs egress enabled.</li>
    </ul>
    <p>A run also ends when the source has delivered no message for 30 seconds. It is then reported as <strong>Completed</strong> only if every message of the check has been sent.</p>
    <aside class="manual-note" data-kind="warning">
        <p>A move cannot be undone. A run that stops, whether you cancel it or it fails, does not put anything back: messages already sent stay on the destination, and messages already removed stay removed from the source.</p>
        <p>The page counts a message as moved once the destination has acknowledged it and the removal has been requested. It does not read the source queue again afterwards. The broker does not answer a removal request, so the page cannot tell whether it worked: a removal the broker refuses goes unseen, the message stays on the source, and the page still counts it as moved. To see what is left on the source, press <strong>Next</strong> again and read <strong>Message Count</strong> before you rely on the result. When a run stops on an error, a message whose acknowledgement arrives after the page has stopped reading the source is counted but is not removed from it, so it can be on both queues.</p>
    </aside>
    <aside class="manual-note" data-kind="tip">
        <p>When you are unsure, try the run first as a <strong>Copy</strong> into a spare queue. A copy never changes the source, so nothing is lost if the destination turns out to be wrong.</p>
    </aside>
</article>
<article class="manual-chapter">
    <h2>Queue Subscriptions</h2>
    <p class="manual-lead">Find out which queues subscribe to a topic. The page lists every topic subscription on the queues you can see, and narrows the list as you type.</p>
    <p>Queue Subscriptions needs the <strong>SEMP connection</strong> from the Connections page. Until SEMP is connected, the page shows <strong>Connection Required</strong> in place of everything below.</p>
    <p>The list holds one row for each subscription: the Message VPN, the queue, and the topic the queue subscribes to. A queue with no topic subscription is not listed. If you signed in to a gateway, the list holds only the queues you are entitled to see, in the Message VPNs you can pick for the broker you are connected to.</p>

    <h3>What you can type</h3>
    <table>
        <thead>
            <tr><th>Column</th><th>How your text is matched</th></tr>
        </thead>
        <tbody>
            <tr><td><strong>VPN</strong> and <strong>Queue</strong></td><td>As any part of the name, in any letter case: <code>def</code> finds <code>default</code>. Put <code>*</code> in the box and your text is matched against the whole name instead, with <code>*</code> standing for any run of characters.</td></tr>
            <tr><td><strong>Subscription</strong></td><td>As a topic, the way Solace compares topics. Your text and the stored subscription may both use the Solace wildcards: <code>*</code> for one level, and <code>&gt;</code> for one or more levels at the end. A row is shown when the two could match the same topic.</td></tr>
        </tbody>
    </table>
    <h4>Examples</h4>
    <table>
        <thead>
            <tr><th>In the box</th><th>You type</th><th>It finds</th></tr>
        </thead>
        <tbody>
            <tr><td>VPN or Queue</td><td><code>def*</code></td><td>Names that start with <code>def</code>.</td></tr>
            <tr><td>VPN or Queue</td><td><code>*ult</code></td><td>Names that end with <code>ult</code>.</td></tr>
            <tr><td>VPN or Queue</td><td><code>def*ult</code></td><td>Names that start with <code>def</code> and end with <code>ult</code>.</td></tr>

      stretches to match. Pairs in order:
        1. Broker        (Source Broker     | Destination Broker + Copy to)
        2. SEMP          (Source SEMP       | Destination SEMP)
        3. Client        (Source Client     | Destination Client)
        4. Target        (Source Queue      | Destination type/name/mode)

      of the source's first three, and one Destination Connection card that
      of the destination's SEMP and Client.

            </div>
            <ul class="copy-notes-list text-secondary">
                <li>Please do not execute this on a live queue with active publisher(s) and consumer(s).</li>
                <li>The entire copy operation will stop once an error is received (e.g. insufficient quota, incorrect
                    permissions).</li>
                <li>The module takes a snapshot of the source queue prior to copying/moving to ensure the operation is
                    bounded.</li>
                <li>Destination must have sufficient spool quota.</li>
                <li>Destination must have an equal or larger max message size.</li>
                <li>Destination must have ingress enabled.</li>
                <li>Souce queue must have egress enabled.</li>
