name: Tag

# The only release pipeline (ci.yml's narrow PR trigger and the SCA scan are
# the other automatic runs). Push a tag, the full stack runs, and a release
# is created ONLY if everything passed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#     -> plan     resolve the project shape once
#     -> gates    ci.yml's `all scan` (build vet test scan), ubuntu + windows
#     -> image    multi-arch build of BOTH variants, pushed to GHCR by digest
#                 only, then a trivy gate on every platform -- no tag yet
#     -> binaries cross-compile the gateway per BUILD_TARGETS, plus the PWA
#     -> publish  point the tags (semver, latest, managed-*) at the scanned
#                 digests
#     -> pages    sync dist/index.html into the `dist` branch
#     -> release  created last, with artifacts, checksums, digests
#
# A failure anywhere leaves no release. Read the logs artifact, push a fix,
# tag again.
#
# Do NOT also add `on: release`. The release this workflow creates would
# re-trigger the whole pipeline.
#
# DEVIATIONS from the standard template (assets/tag.yml), all forced by this
# project's shape -- keep this list current if you touch the file:
#   1. DOCKERFILE is docker/Dockerfile, not the repo root, in `plan` and
#      `image`. Without it the shape auto-detect finds no Dockerfile and no
#      image ships.
#   2. `image` is a 2-leg matrix (standard, managed). The managed leg bakes
#      MANAGED/HOSTED/CONN_MODES, ships the /solAdmin app, and builds the
#      gateway with -tags managed. The stock single-image job would silently
#      drop the managed image family.
#   3. Both legs pass APP_VERSION so the tag reaches the Go binary's ldflags
#      and the PWA bundle's __APP_VERSION__. Git is not available inside the
#      build, so it has to arrive as a build-arg.
#   4. A `pages` job, carried over from the old release.yml, redeploys
#      solacelabs.github.io/solace-msg-utility from the `dist` branch. Gated
#      on everything else passing, so a red scan no longer redeploys the site.
#   5. Image digests travel to `publish` and `release` as artifacts, not as a
#      job output, together with the tags `publish` applies. Matrix legs
#      overwrite each other's outputs nondeterministically, so a 2-leg matrix
#      cannot use `outputs:` for a per-leg value.
#   6. A setup-node step in `binaries`, reading .tool-versions -- Node has no
#      self-honouring in-repo pin the way go.mod's `toolchain` directive does.
#      ci.yml carries the same step for the same reason.
#   7. `image` pushes by digest only and trivy-scans each platform of that
#      digest; a separate `publish` job creates the tags, and only once both
#      legs and `binaries` passed. The stock job pushed its tags and scanned
#      afterwards, so a red scan blocked the Release but `latest` already
#      pointed at the failing image.
#
# Repo variables (Settings > Secrets and variables > Actions > Variables):
#   BUILD_TARGETS  JSON array, e.g. [{"os":"linux","arch":"amd64"}]
#   SHIP_IMAGE     optional override, "true" or "false". Unset means "is
#                  there a Dockerfile".

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: tag-${{ github.ref_name }}
  cancel-in-progress: false # never abort a half-published pipeline

jobs:
  # Resolve the shape once, loudly, before anything expensive runs. Both
  # toggles are validated here so a typo fails with a readable message
  # instead of an opaque matrix-expansion error later.
  plan:
    runs-on: ubuntu-24.04 # pinned; see ci.yml
    outputs:
      ship_image: ${{ steps.shape.outputs.ship_image }}
      ship_binaries: ${{ steps.shape.outputs.ship_binaries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: shape
        env:
          SHIP_IMAGE: ${{ vars.SHIP_IMAGE }}
          BUILD_TARGETS: ${{ vars.BUILD_TARGETS }}
          DOCKERFILE: docker/Dockerfile # deviation 1
        run: |
          set -euo pipefail

          case "$(printf '%s' "${SHIP_IMAGE:-}" | tr '[:upper:]' '[:lower:]')" in
            true|yes|1) img=true ;;
            false|no|0) img=false ;;
            "") if [ -f "$DOCKERFILE" ]; then img=true; else img=false; fi ;;
            *) echo "::error::SHIP_IMAGE must be true or false, got '$SHIP_IMAGE'"
               exit 1 ;;
          esac

          if [ -n "${BUILD_TARGETS:-}" ]; then
            printf '%s' "$BUILD_TARGETS" \
              | jq -e 'type == "array" and length > 0' >/dev/null 2>&1 \
              || { echo "::error::BUILD_TARGETS must be a non-empty JSON array of {os,arch}"; exit 1; }
            bins=true
          else
            bins=false
          fi

          if [ "$img" = false ] && [ "$bins" = false ]; then
            echo "::error::nothing to ship: no Dockerfile (or SHIP_IMAGE=false) and BUILD_TARGETS unset"
            exit 1
          fi

          echo "ship_image=$img" >> "$GITHUB_OUTPUT"
          echo "ship_binaries=$bins" >> "$GITHUB_OUTPUT"
          echo "::notice::shape -- image=$img binaries=$bins"

  gates:
    needs: plan
    # `scan` reduces to the applicable subset inside the dev scripts, so this
    # is valid for all three shapes: with no image it is the dependency scan
    # alone. It is fatal on fixable CVEs, so a red gate stops the release.
    uses: ./.github/workflows/ci.yml

  image:
    needs: [plan, gates]
    if: needs.plan.outputs.ship_image == 'true'
    name: image (${{ matrix.name }})
    runs-on: ubuntu-24.04 # pinned; see ci.yml
    permissions:
      contents: read
      packages: write # push to GHCR
    strategy:
      # Build and scan both variants even if one fails, so one red run shows
      # both legs' findings. `publish` still tags neither unless both passed.
      fail-fast: false
      matrix:
        # Both legs ship the SAME PWA bundle -- connection posture is a runtime
        # decision (CONN_MODES via /hosted), not a per-image build. The managed
        # leg additionally ships solAdmin.html and a gateway built with the
        # `managed` tag (RBAC store + /managed/* handler + the yaml dep).
        include:
          - name: standard
            managed: ""
            hosted: ""
            conn_modes: ""
            with_admin: ""
            go_tags: ""
            flavor: ""
            tags: |
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=semver,pattern={{major}}
              type=raw,value=latest
          - name: managed
            managed: "true"
            hosted: "true"
            conn_modes: "managed"
            with_admin: "true"
            go_tags: "managed"
            # prefix=managed-,onlatest=true + latest=true turns the semver
            # patterns into managed-X.Y.Z / managed-X.Y / managed-X and the
            # latest tag into managed-latest. No bare `latest`, so no collision
            # with the standard image.
            flavor: |
              latest=true
              prefix=managed-,onlatest=true
            tags: |
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=semver,pattern={{major}}
    env:
      DOCKERFILE: docker/Dockerfile # deviation 1
      # One `Trivy gate (<platform>)` step per entry; "Resolve per-platform
      # digests" fails the leg if the index serves a platform no step scans.
      PLATFORMS: linux/amd64,linux/arm64
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # GHCR rejects uppercase; github.repository preserves owner casing.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # no PAT for same-repo pushes

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: ${{ matrix.flavor }}
          tags: ${{ matrix.tags }}

      # The deliberate divergence from dev.sh: multi-arch buildx, a registry
      # push and the tag move in `publish` cannot run identically on a laptop.
      # `dev.sh image` is the local single-arch equivalent; note `all scan`
      # above did not run it, though `scan` builds an image when the project
      # ships one.
      #
      # By digest only (deviation 7): `outputs` pushes the multi-arch index
      # under its digest and no tag, so nothing a tag pull can reach exists
      # until trivy passes below and `publish` names this digest. Keep `push:`
      # and `tags:` off this step -- either one publishes tags before the scan.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            MANAGED=${{ matrix.managed }}
            HOSTED=${{ matrix.hosted }}
            CONN_MODES=${{ matrix.conn_modes }}
            WITH_ADMIN=${{ matrix.with_admin }}
            GO_TAGS=${{ matrix.go_tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-variant cache scope so the two parallel legs don't race writing
          # the gha cache.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

      # Trivy on a multi-arch index scans a single platform unless told which,
      # so the gate scans each platform's own manifest instead -- no reliance on
      # a platform flag reaching trivy through the action, which has no such
      # input. The index is content-addressed, so its digest pins exactly these
      # children. Fails if the index serves a platform no Trivy gate step below
      # covers. Attestation manifests (provenance, SBOM) carry no packages.
      - id: platforms
        name: Resolve per-platform digests
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          SCANNED: linux/amd64 linux/arm64 # sorted; one Trivy gate step each
        run: |
          set -euo pipefail
          idx="$(docker buildx imagetools inspect "$REF" --raw)"
          pushed="$(jq -r '[.manifests[]
              | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
              | "\(.platform.os)/\(.platform.architecture)"] | sort | join(" ")' <<<"$idx")"
          if [ "$pushed" != "$SCANNED" ]; then
            echo "::error::the index serves [$pushed] but the Trivy gate steps scan [$SCANNED]"
            exit 1
          fi
          jq -r '.manifests[]
              | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
              | "\(.platform.architecture)=\(.digest)"' <<<"$idx" >> "$GITHUB_OUTPUT"

      # The gate, before any tag exists. A second pass over what `scan` in the
      # gates job already checked, but only this one sees the multi-arch
      # result. A failure leaves an untagged digest nothing points at, and
      # `publish` never runs. The action rather than `docker run`, so
      # Dependabot tracks it; `version:` is the trivy it installs, which
      # Dependabot does NOT move -- keep it equal to TRIVY_IMAGE / $TrivyImage
      # in the dev scripts (docs/git.md, "Keeping the workflow pins current").
      - name: Trivy gate (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          NO_COLOR: "1"
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.platforms.outputs.amd64 }}
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Runs even when amd64 failed, so one red run shows both platforms'
      # findings; the leg still fails on the first.
      - name: Trivy gate (linux/arm64)
        if: ${{ !cancelled() && steps.platforms.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          NO_COLOR: "1"
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ steps.name.outputs.image }}@${{ steps.platforms.outputs.arm64 }}
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Deviation 5: a per-leg value cannot travel through `outputs:` on a
      # matrix job -- the legs overwrite each other in completion order. The
      # .md line goes into the Release notes; the .json is what `publish`
      # tags. Reached only when both platforms passed.
      - name: Record the scanned digest
        env:
          LEG: ${{ matrix.name }}
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          META: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          printf '%s: `%s@%s`\n' "$LEG" "$IMAGE" "$DIGEST" > "imgref-$LEG.md"
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --argjson meta "$META" \
            '{image: $image, digest: $digest, tags: $meta.tags}' > "imgref-$LEG.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imgref-${{ matrix.name }}
          path: |
            imgref-${{ matrix.name }}.md
            imgref-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 7

  binaries:
    needs: [plan, gates]
    if: needs.plan.outputs.ship_binaries == 'true'
    runs-on: ubuntu-24.04 # pinned; see ci.yml
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(vars.BUILD_TARGETS) }}
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Deviation 6: `build` emits the PWA too, so this job needs the same Node
      # pin the gates job takes from ci.yml.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm

      # The workflow names the target; the script decides how to honour it
      # (GOOS/GOARCH, --target, -r RID, ...). Unset means host build, so the
      # same `build` task serves local use and cross-compilation.
      #
      # `build` also emits the PWA bundles, which are target-independent, so
      # every leg produces an identical copy of them. merge-multiple in the
      # release job collapses those; the gateway binaries carry their target in
      # the filename and so survive the merge intact.
      - name: Cross-compile
        env:
          TARGET_OS: ${{ matrix.target.os }}
          TARGET_ARCH: ${{ matrix.target.arch }}
          VERSION: ${{ github.ref_name }}
        run: ./scripts/dev.sh build

      # Handed to the release job, since the release does not exist yet.
      # The release job merges these with merge-multiple, so `build` MUST name
      # outputs <name>-<os>-<arch> -- identical names overwrite silently.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/
          if-no-files-found: error # BUILD_TARGETS asked for this; empty is a bug
          retention-days: 7

  # Deviation 7. The tags are the publication, so they move last: only once
  # both image legs passed trivy on every platform AND the binaries built --
  # a red gate, scan or build leaves `latest` and `managed-latest` where they
  # were. A single-source `imagetools create` re-pushes the index bytes
  # unchanged, so each tag names the exact digest trivy scanned; the loop
  # checks that rather than trusting it. Never add --annotation here: it
  # rewrites the index and changes the digest. No setup-buildx: imagetools
  # only needs the runner's default builder for registry auth. `!cancelled()`,
  # not `always()`: a run cancelled after the scans must not move the tags.
  publish:
    needs: [image, binaries]
    if: >-
      !cancelled()
      && needs.image.result == 'success'
      && needs.binaries.result != 'failure' && needs.binaries.result != 'cancelled'
    runs-on: ubuntu-24.04 # pinned; see ci.yml
    # Repo-wide, unlike the per-tag group at the top: two tags pushed together
    # both move `latest`, and the check below must not see the other run's
    # write. Never cancel a running publish. GitHub keeps one PENDING job per
    # group, so a third simultaneous tag cancels the older pending one.
    concurrency:
      group: ghcr-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # move tags on GHCR
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: imgref-*
          merge-multiple: true
          path: imgrefs/

      - name: Tag the scanned digests
        run: |
          set -euo pipefail
          for f in imgrefs/*.json; do
            image="$(jq -r .image "$f")"
            digest="$(jq -r .digest "$f")"
            mapfile -t tags < <(jq -r '.tags[]' "$f")
            if [ "${#tags[@]}" -eq 0 ]; then
              echo "::error::$f carries no tags -- is the git tag vX.Y.Z?"
              exit 1
            fi
            args=()
            for t in "${tags[@]}"; do args+=(--tag "$t"); done
            docker buildx imagetools create "${args[@]}" "$image@$digest"
            for t in "${tags[@]}"; do
              got="$(docker buildx imagetools inspect "$t" --format '{{json .Manifest}}' | jq -r .digest)"
              if [ "$got" != "$digest" ]; then
                echo "::error::$t resolves to $got, not the scanned $digest"
                exit 1
              fi
              echo "::notice::$t -> $digest"
            done
          done

  # Deviation 4. Pages serves the PWA from the `dist` branch, which already
  # holds the vendor files (solclient.js, jszip.min.js), .nojekyll and CNAME.
  # We overlay only index.html; everything else on that branch is left alone.
  # Pages is gateway-less, so it is Direct-connection-only by design.
  pages:
    needs: [plan, gates, image, binaries, publish]
    if: >-
      always()
      && needs.gates.result == 'success'
      && needs.image.result != 'failure' && needs.image.result != 'cancelled'
      && needs.publish.result != 'failure' && needs.publish.result != 'cancelled'
      && needs.binaries.result == 'success'
    runs-on: ubuntu-24.04 # pinned; see ci.yml
    permissions:
      contents: write
    steps:
      - name: Check out the dist branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dist
          fetch-depth: 0

      # Any leg's bundle would do -- they are identical -- but naming one keeps
      # the step deterministic.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bin-linux-amd64
          path: _bundle

      - name: Publish index.html
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp _bundle/index.html ./index.html
          rm -rf _bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "::notice::no bundle change; nothing to deploy"
            exit 0
          fi
          git commit -m "Deploy $TAG"
          git push origin dist

  release:
    needs: [plan, gates, image, binaries, publish]
    # Either producer may be skipped; neither may fail; and at least one must
    # have actually shipped, so a run that shipped nothing never publishes.
    # An image ships at `publish`, not at `image`.
    if: >-
      always()
      && needs.plan.result == 'success'
      && needs.gates.result == 'success'
      && needs.image.result != 'failure' && needs.image.result != 'cancelled'
      && needs.publish.result != 'failure' && needs.publish.result != 'cancelled'
      && needs.binaries.result != 'failure' && needs.binaries.result != 'cancelled'
      && (needs.publish.result == 'success' || needs.binaries.result == 'success')
    runs-on: ubuntu-24.04 # pinned; see ci.yml
    permissions:
      contents: write # the only job that can write to the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.binaries.result == 'success'
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.publish.result == 'success'
        with:
          pattern: imgref-*
          merge-multiple: true
          path: imgrefs/

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Idempotent: re-running the workflow must not hard-fail.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists, leaving it alone"
            exit 0
          fi

          # Checksums over whatever the matrix produced, before it is listed
          # as an asset so SHA256SUMS.txt never hashes itself.
          if [ -d dist ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
            ( cd dist && sha256sum -- * > ../SHA256SUMS.txt )
            mv SHA256SUMS.txt dist/
          fi

          # Compose notes up front so the release is correct at creation.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" -q .body > notes.md
          if [ -d imgrefs ] && [ -n "$(ls -A imgrefs 2>/dev/null)" ]; then
            printf '\n\n---\n\nImages:\n\n' >> notes.md
            cat imgrefs/*.md >> notes.md
            printf '\nPinned by digest -- dependents must redeploy to pick this up.\n' >> notes.md
          fi

          # Word-splitting is intentional: no binaries means no file args.
          # shellcheck disable=SC2046
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            $(ls -1 dist/* 2>/dev/null || true)
